# Pin the Robolectric runtime to API 34 for WearDataLayerInbox's tests.
#
# The inbox needs only a Context, real SharedPreferences and real org.json — none of which vary
# across recent API levels — so any level Robolectric 4.16.1 supports works. 34 is a safe, widely
# available image and avoids coupling this to whatever targetSdk the prebuilt phone app resolves.
sdk=34
