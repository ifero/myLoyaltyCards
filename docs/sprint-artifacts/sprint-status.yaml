  # Epic 10: Wear OS App
  epic-10: done # COMPLETED 2026-08-13, closed at the 2026-08-20 retrospective (docs/sprint-artifacts/epic-10-retro-2026-08-20.md). All six stories done and merged (#201/#204/#205/#206/#208/#209): 142 files, +15,050 lines, a standalone watch-android/ Gradle project (69 Kotlin files, 156 JVM tests running in CI) plus a new phone-side local Expo module modules/wear-data-layer. CLOSED WITH AN ACCEPTED RISK (DEC-E10-RETRO-001): Story 10-6's AC17 two-device validation and AC18 Apple Watch hardware re-check were never performed and the story was merged with both tables unfilled; ifero accepted the risk rather than holding the epic. Wear OS also has NO crash reporting, so that risk is currently unmonitorable — retro action item 1. The parked Epic 5 generic-complication follow-up is STILL unstoried after four sprints; re-parked with a trigger (DEC-E10-RETRO-002): draft it when the Wear APK is published to Play.
  10-1-create-wear-os-project-structure: done # 2026-08-02 implemented, awaiting review. 2026-07-29 refined. KEY ARCHITECTURAL FINDING: this does NOT mirror watchOS. The watch app is a target INSIDE the phone's Xcode project (hence @bacons/apple-targets generating it into the gitignored ios/), but a Wear OS app is a SEPARATE APK, uploaded and updated independently in Play — so watch-android/ is a STANDALONE Gradle project with its own wrapper and needs NO config plugin at all. That makes 10-1 cheaper than 5-1 was. Nothing may be written into android/ (.gitignore:52-53, regenerated by expo prebuild — Story 16.7's lesson). Three non-negotiable platform constraints: applicationId must be IDENTICAL to com.iferoporefi.myloyaltycards (NOT `.watch`-suffixed as targets/watch/expo-target.config.js does — required for Play association + Data Layer), same signing key, and a Digital Asset Links entry (applicationId + signing SHA-256). Versions VERIFIED: minSdk 30 (Wear OS 3 floor / Play's Wear quality requirement), targetSdk 35 — Play's 2026 rule is API 36 but Wear OS + Automotive are explicitly carved out at 35 for new submissions. AGP/Kotlin/Compose deliberately NOT pinned (record what was used). Open decisions: non-standalone manifest (companion-only, cannot obtain cards without a phone); versionCode band 2_000_000 (a THIRD consumer of Play's shared space after Story 16.7's beta + 1_000_000 production bands, set in watch-android's own Gradle, not app.config.ts); path-filtered CI build job now, not later. Corrected a loose claim in 16-21: a standalone Kotlin Wear app runs no JS/Hermes, so the SDK 57 Hermes-memory coupling is weaker than written and is NOT a blocker.
  10-2-generate-catalogue-for-wear-os: done # 2026-08-03 implemented, awaiting review. Delivered as specified (all three epic ACs superseded as planned): Node generator scripts/generate-wear-catalogue.mjs → committed watch-android/app/src/main/kotlin/com/iferoporefi/myloyaltycards/wear/Generated/Brands.kt, `yarn wear:catalogue:generate`/`:check`, drift gate in .husky/pre-push AND ci-quality-gates.yml (NOT wear-os-build.yml — that job is path-filtered to watch-android/**, so a catalogue-only PR would never trigger it, which is the exact case the gate exists for). Gradle runs no codegen; assembleDebug + lintDebug pass. THREE DELIBERATE DEVIATIONS from the AC text, each justified: (1) the catalogue is at 57 brands not 56 (version 2026-08-02) — nothing hardcodes a count, tests assert against catalogue.brands.length; (2) `defaultFormat` IS emitted although AC2 enumerates only id/name/aliases/logo/color+version — it is the catalogue's only optional field, so AC3's stricter "no field is dropped" + "a null-ish optional must round-trip" can only refer to it, and dropping it would force 10-4 to change the generator; kept `String?`, not an enum, because AC3 forbids re-typing; (3) accessors are WearBrands.ALL/VERSION not `all`/`version`, per kotlinlang's rule that const val and object vals holding deeply immutable data are SCREAMING_SNAKE_CASE. IMPROVEMENT over the Swift original: the incremental-skip decision hashes the OUTPUT as well as the inputs — the Swift generator hashes inputs only, which deadlocks a hand-edited artifact (inputs match so `generate` skips, while `--check` keeps failing and telling you to run `generate`); that latent bug still exists in watch-ios/Scripts/generate-catalogue.swift and is flagged, not fixed. Kotlin's escape set was verified against the REAL compiler, not just docs: a throwaway probe with \\ " $ ${…} \n\t\r\b, a form feed and U+0000/001F/007F/009F compiled under Kotlin 2.4.10 (Kotlin has NO \f, so other control chars must go out as \uXXXX). Generator refuses unknown catalogue fields and duplicate ids rather than dropping/reordering silently. 41 tests decode the emitted Kotlin literals with an independent unescaper (full 57-brand round-trip) and one runs --check against the TRACKED file, making `yarn test` a third drift gate. Also corrected two docs that described the superseded design: docs/architecture.md's Wear tree (.kts + gitignored + build-time) and CONTRIBUTING.md's gate list, which was ALREADY missing check:story-catalogue-sync. STILL OPEN: docs/epics.md Story 10.2 text is deliberately left describing the superseded design (regenerated from the tracker, not authoritative); Epic 10 has no complication story despite the parked Epic 5 follow-up, and a complication is the only surface needing real brand artwork. Prior refinement note: 2026-07-29 refined. DELIBERATELY SUPERSEDES THREE OF EPIC 10's WRITTEN ACs for this story. epics.md says the generated file goes in .gitignore and that Gradle runs the generator pre-compile; the project REJECTED that design for watchOS in Story 5-8 (AC4 "Keep generated file committed") and settled on commit-the-artifact + a CI drift check. Verified: .gitignore:65-66 ignores targets/watch/Generated/* but explicitly un-ignores Brands.swift, and git ls-files confirms it is tracked — the same shape at :70-71 for the widget catalog. This is the house pattern applied three times with a gate each (tokens.generated.ts/tokens:check, splash-icon.png/splash:check, Brands.swift/check:catalogue-generated). A gitignored artifact cannot be drift-checked, so a stale catalogue would ship silently. Also supersedes the `.kts` script: use a Node .mjs generator matching the two existing ones, because once the artifact is committed the Gradle build never runs the generator, which dissolves the "Gradle would need Node" objection. Port from generate-catalogue.swift: determinism (sort by id), repo-relative provenance comment (:109-121 — absolute paths break cross-machine drift checks), input hashing for incremental skip (:183-205), --check mode that never writes over the tracked file, test-safety throwaway paths. Kotlin-specific trap: `$` must be escaped in string literals as well as `\` and `"`. CORRECTED an earlier overstatement: the card list needs NO brand artwork — CardListView.swift:372-389 renders INITIALS on a brand-coloured circle — so no Wear drawable pipeline is required by Epic 10 as scoped; only a (non-existent, unstoried) complication would need one.
  10-3-implement-card-list-carbon-ui: done # 2026-07-29 refined. Carries the Epic 9 parity that correct-course added to Epic 10 on 2026-06-09: favourite indicator (mirror 9-4) and selectable persisted sort (mirror 9-5) are IN SCOPE, not follow-ups. BIGGEST ASYMMETRY: Wear OS screens are frequently ROUND and watchOS never is, so CardListView.swift has no concept of screen shape and a naive port of horizontalPadding:10 clips rows top/bottom on a round display — requires the Wear Compose scaling list container (NOT LazyColumn), shape-aware padding and rotary scrolling. Port WatchCardRowLayoutMetrics.compact (WatchPresentationLayout.swift:25-34 — Story 5-10's density tuning, +1 visible row on 41mm) with ONE change: tap target 48dp, not Apple's 44. Sort rules already settled by 9-5 and its THREE review rounds — inherit the fixes, not the bugs: watch default is A-Z (not the phone's `frequent`), A-Z must be diacritic-insensitive not just case-insensitive (review finding #5, matters for the Italian-first audience — use a locale Collator, never lowercase()), and `frequent` has a mixed-null tier parity fix (finding #1). Sort pref is watch-local and never transmitted — permitted because it is UI state, not card data. Defines a read seam that 10-5 implements; must NOT build a store (Story 5-9's lesson). Debug seeder must be empty-state-gated from the start (9-5 had to retrofit that).
  10-4-display-barcode-on-wear-os: done # 2026-07-29 refined. DO NOT PORT targets/watch/BarcodeGenerator.swift — those 500 lines hand-implement EAN-13/Code128 encoders + a CGImage renderer purely because watchOS ships no barcode library. Android has ZXing (pure JVM, so JVM-unit-testable without an emulator). FORMAT GAP FOUND: the schema defines SIX formats (core/schemas/card.ts:16-23) but watchOS renders only THREE — EAN8, CODE39 and UPCA fall through leaving `modules` nil and generateImage returns nil (BarcodeGenerator.swift:51-69; its own doc comment at :38 admits "Supports EAN-13, Code128, and QR"), so an EAN-8 card shows NOTHING on Apple Watch today. Wear OS supports all six via ZXing at no extra cost, deliberately exceeding watchOS parity; the watchOS gap is flagged as an unstoried user-facing defect for ifero. barcodeImageBase64 (the phone-pre-rendered QR, WATCH_QR_PIXEL_SIZE 144 against a 48_000-byte budget) is NOT needed — Wear renders locally. Port the LAYOUT maths (WatchBarcodeLayoutMetrics.make, QR-vs-linear branch, 112 QR floor, linear 0.52/88-110 clamp, widthFillRatio so 5-10's ≥80%-width bar is measured not eyeballed), size against the round display's INSCRIBED area, and add brightness maximisation + keep-awake — parity with the phone's useBrightness, which watchOS lacks entirely. AC12 requires PHYSICAL scanner validation: contrast, module width, quiet zone and brightness are all invisible in an emulator screenshot.
  10-5-store-cards-locally: done # 2026-07-29 refined. ONE storage surface, Room only — watchOS shipped TWO (a UserDefaults `watch.cards` key + SwiftData, with a migration fallback and a UITEST_CARDS env shim) and Story 5-9 existed solely to delete them "before public release" so tests use a single data surface. Dates stored as ISO-8601 UTC MILLISECOND STRINGS, which is the documented project rule (project-context.md "store dates as strings") that WatchCardEntity.swift itself does not follow (it uses Date) — and it is load-bearing here because 10-6's dedup key is "<cardId>:<usedAt>" and ADR-2026-06-09-001 makes second precision non-conformant, so a date-type round-trip is exactly how ms get dropped. String ISO-8601 also sorts chronologically with no parsing. TWO MIRROR DISCREPANCIES documented: WatchCardEntity has an `updatedAt` with NO wire source (WatchCardPayload lacks it, so it records local insert time, not phone update time — do not model it as authoritative), and wire→entity field names differ (barcodeValue→barcode, colorHex→color) so map explicitly at the boundary. fallbackToDestructiveMigration forbidden in release (it would silently wipe cards, breaking 5-5 AC3). Mirror rawPayload for forward compat but strip barcodeImageBase64 (largest field, never read since 10-4 renders locally). Read-only enforced by 9-5's HARDENED test form (a local edit must not survive a store reload), not the vacuous version 9-5 replaced.
  10-6-sync-cards-from-phone: done # 2026-08-12 implemented (Opus 5), awaiting review. The scope finding below was CONFIRMED: half the story is a new phone-side Android native module, delivered as the local Expo module modules/wear-data-layer (Kotlin, autolinked, verified to survive `expo prebuild --clean` by running it and grepping the MERGED app manifest + merged resources). Dispatch seam is core/wearable-sync.ts; iOS is byte-for-byte unchanged and core/watch-connectivity.test.ts passes UNTOUCHED (only four `export` keywords were added to that file). AC10 needed NO extraction after all — applyWatchUsageEvents was already transport-agnostic; only the subscription was iOS-coupled, so there is still exactly one reconciliation path. ⚠️ FOUND AND FIXED A LATENT TRAP THAT WOULD HAVE SHIPPED A BROKEN PR: .gitignore's `android/` is UNANCHORED, so it matched modules/wear-data-layer/android/ and git would have committed the module's TypeScript half with ZERO Kotlin — building for the author and nobody else. Fixed with a negation pair (!modules/*/android/ + re-ignore of build/) rather than anchoring, which would un-ignore every nested native dir at once. ANY FUTURE LOCAL EXPO MODULE INHERITS THE FIX. ⚠️ test-fixtures/sync-message-v1.json DID NOT EXIST despite being cited by this story, project-context.md and architecture.md — and its sibling card-valid.json is read by NO test on ANY platform, so "cross-platform fixtures" was documentation only. Created it AND made it a real gate on both sides. NEW CI-ENFORCED DRIFT GATE: core/wear-sync-contract.test.ts is a TS test that reads the KOTLIN source + manifest (the watch-layout-contract.test.ts technique) because the wire contract exists in three artifacts with no build-time link; mutation-checked by renaming PHONE_CAPABILITY. It runs under `yarn test`, which is NOT path-filtered — unlike wear-os-build.yml, which is scoped to watch-android/** and would miss a phone-only contract change. DESIGN NOTES: phone needs its OWN durable inbox (SharedPreferences, read-then-acknowledge) because the watch deletes an event on send success while the RN host is usually dead — without it AC9 "never lost" is false; a malformed card rejects the WHOLE snapshot because with full-replace semantics "skip the card" == "delete the card"; the phone ALLOWLISTS inbound types because WatchMessage includes syncCard{cardData} and AC8 must not depend on the watch behaving; over-budget snapshots degrade by priority (favourites/usage) not by tail-truncation, since getAllCards is ORDER BY name ASC; CapabilityClient is required by AC5 itself ("on becoming connected"), so the outbox reconnect flush rides the same signal; live listeners on the watch but a background WearableListenerService on the phone (asymmetric, each justified). Added a 1s/2s flush retry after a test showed "reachable" != "send will succeed". Room v1->v2 adds usage_outbox; CardMigrationTest now drives the REAL migration (10-5 wrote it as a template for exactly this). GATES: lint/typecheck/test(2148)/coverage 93.63%/format/tokens/splash/catalogue/wear-catalogue all green; gradle testDebugUnitTest(145)+assembleDebug+lintDebug green; `yarn watch:build` BUILD SUCCEEDED. ⚠️ BLOCKED, NOT DONE: AC17 physical two-device validation and the hardware half of AC18 need real devices the agent does not have. Both tables in the story are pending @ifero. DO NOT MARK DONE UNTIL FILLED. Prior refinement note: 2026-07-29 refined. 🚨 SCOPE FINDING — EPIC 10 UNDER-SCOPED THIS. react-native-watch-connectivity is iOS-ONLY (verified: the installed package has ios/, dist/, RNWatch.podspec and NO android/), there is no Play Services Wearable dependency anywhere, and no modules/ directory exists. So roughly HALF this story is a NEW phone-side Android native module (Kotlin) exposing DataClient/MessageClient to JS, which must live OUTSIDE the gitignored android/ as a tracked local Expo module, plus a platform-dispatching seam so iOS keeps WatchConnectivity untouched. That makes 10-6 materially larger than its five siblings; a split into 10-6a (phone transport + seam) / 10-6b (watch receive + CARD_USED outbox) is RECOMMENDED but left to ifero rather than re-keyed mid-sprint. Transport mapping is not one-to-one: DataClient ≈ applicationContext (persistent, last-write-wins) for the snapshot, MessageClient for the requestCards ping, but transferUserInfo's OS-level FIFO queue has NO Wear equivalent, so CARD_USED needs an explicit DURABLE OUTBOX in Room — and card opens happen seconds after a wrist-raise, exactly when the transport is least ready (WatchSessionManager.swift:19-20 records that transferUserInfo drops payloads pre-activation). A DataItem set while the watch app was dead is NOT re-delivered as a change event, so a start-up read is mandatory or a fresh install shows an empty list. Snapshot applies as a FULL REPLACE in one transaction so deletions propagate — Story 16-11 shipped precisely the opposite bug on the phone (deletion-blind full-fetch merge resurrected deleted cards while a purpose-built deletion-aware merge sat dead since 7.6). Reuse the phone's existing commutative CARD_USED handler by EXTRACTING it, never cloning (16-11 again). usedAt must be ms-precision or the phone's regex silently rejects it. Route Android transport failures through logger.notify, not logger.warn (__DEV__-only, Story 16-14) — this platform has no other telemetry. AC17 needs physical two-device validation (9-6 left transferUserInfo flagged as needing exactly that) and AC18 re-verification of the shipped Apple Watch path.
