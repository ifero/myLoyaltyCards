  16-26-hold-watch-display-luminance: ready-for-dev # 2026-08-02: raised by ifero — "most of the checkout scanners don't recognise the barcodes from the apple watch"; first of two requested fixes ("increase luminosity to 100% when showing barcode"). ⚠️ CANNOT BE BUILT AS WORDED: watchOS exposes NO public brightness API. The phone's parity implementation, useBrightness (features/cards/hooks/useBrightness.ts, Story 2.5), wraps expo-brightness → UIScreen.brightness, and UIScreen DOES NOT EXIST on watchOS; WKInterfaceDevice has no brightness property. VERIFIED by grep across targets/ — zero hits for brightness, ExtendedRuntime or isLuminanceReduced, so BarcodeFlashView does nothing about luminance today. Story 10-4's research note already recorded the same gap from the Wear OS side ("add brightness maximisation + keep-awake — parity with the phone's useBrightness, which watchOS lacks entirely"). SCOPE DECIDED 2026-08-02 by ifero: deliver keep-awake + anti-dim, no user-facing hint copy (rejected the "one-time hint" variant, so no new locale keys in en.lproj/it.lproj). ⚠️ AC1 IS A REAL FORK, NOT A FORMALITY: WKExtendedRuntimeSession requires a WKBackgroundModes entry in targets/watch/Info.plist, and the permitted values (self-care, mindfulness, physical-therapy, alarm, workout-processing, location) do not describe a loyalty barcode — claiming one is App-Review risk and must NOT be shipped on a guess. If AC1 rules it out, the story still closes on the AC3 fallback (observe @Environment(\.isLuminanceReduced), hold maximum contrast while reduced). Insertion points identified: start in the existing .task(id: card.id) at BarcodeFlashView.swift:104 (already does focus + haptic + the Story 9.6 usage event), tear down in .onDisappear at :139 next to the focus reset. Must not disturb tap-dismiss (:43) or the single-shot crown latch (:93-100). The 15s-vs-70s system Wake Duration setting is app-wide and deliberately OUT of scope — documented in findings only. NATIVE → NOT OTA-eligible. Conflict watch: 16-27 also edits BarcodeFlashView.swift but in the layout region, not the lifecycle blocks — parallel-safe with a trivial rebase.
  16-27-fix-watch-barcode-geometry: ready-for-dev # 2026-08-02: raised by ifero alongside 16-26 — second requested fix ("try to reduce the margins to use as much space as possible"). INVESTIGATION REFRAMED THE ASK: margins are NOT the bottleneck. WatchPresentationLayout.swift:57-58 already sets outer padding to 0 and :59 sets inner to 2, so the reclaim available there is ~2.5% of width. THE ACTUAL DEFECT IS MODULE QUANTISATION — the same mechanism Story 16-23 measured and proved. BarcodeGenerator.renderCGImage (:313-364) disables antialiasing (:335) and snaps every module boundary with Int(round(acc)) (:342, :349-350); because the module width is not an integer, 1-module elements render at TWO DIFFERENT WIDTHS. Squeezed further by quietZoneModules: 10 per side (:74) — measured in MODULES, so it costs a fixed 17.4% of width (EAN-13 = 95 modules but 115 units). COMPUTED FROM SOURCE at boxInnerPadding 2 and @2x: 40mm 316px → 2.75 px/module (2 or 3 px, 1.50× spread); 41mm 344px → 2.99; 44mm 360px → 3.13; 45mm 388px → 3.37; 46mm 408px → 3.55 (3 or 4 px, 1.33×). 16-23 pinned the PENNY failure at ≈2.83 px/module where "a 1-module element must round to 2 or 3px — a 50% error", so A 40mm WATCH RENDERS EAN-13 WORSE THAN THE ARTWORK THAT COULD NOT BE SCANNED. ⚠️ NOTE THE MAGNIFICATION IS NOT THE PRIMARY FAULT: at ≈9.5 px/mm, 2.75px ≈ 0.29mm ≈ 88% of EAN-13's nominal 0.33mm, inside the permitted 80–200% band. IT IS THE VARIANCE, NOT THE SIZE. FIX: integer-snap (module = floor(availablePx / totalUnits), centre the remainder), per-symbology quiet zones (EAN-13 is 11 leading + 7 trailing = 18, not the current symmetric 20; Code128 is 10 each side), per-symbol unit counts (a 13-digit Code128 is ≈123 modules vs EAN-13's 95, so ≈24% wider), and a ≥80% magnification floor that REFUSES rather than draws. ORIENTATION DECIDED 2026-08-02 by ifero — "rotate only when it's needed": horizontal stays the default, 90° rotation is the fallback the geometry forces (long axis 197–251pt vs short axis 162–208pt = 20–25% more), threshold COMPUTED not hardcoded. NICE RESULT: dropping boxInnerPadding 2 → 0 gives a 41mm watch 352px against the 345px that 3px/module needs, so ifero's margin-trim request is EXACTLY what keeps a 41mm horizontal. ⚠️ THE px/module FIGURES ARE DERIVED FROM SOURCE, NOT MEASURED ON HARDWARE — unlike 16-22's and 16-23's numbers; the device pass is what converts them to evidence. Bump BarcodeGenerator's cacheVersion (currently "watch-barcode-v2", :27) — the cache key includes target size (:45) but not the renderer version, so devices would serve stale pre-fix images. QR path untouched (2D, different failure mode): keeps its square-fit branch + 112pt floor (WatchPresentationLayout.swift:66-71) and the phone-pre-rendered barcodeImageBase64 fast path (BarcodeFlashView.swift:118-124). NATIVE → NOT OTA-eligible. Shares BarcodeGenerator.swift with 16-28 and BarcodeFlashView.swift with 16-26. Story 10-4 plans to port WatchBarcodeLayoutMetrics.make to Wear OS and should inherit the FIXED maths. ⚠️ AMENDED 2026-08-02 AFTER AN ADVANCED-ELICITATION PASS (assumption audit + map-is-not-the-territory + boundary sweep) — THREE CORRECTIONS, ONE OF WHICH KILLED AN AC: (1) THE PIXEL DENSITY WAS WRONG. Drafted at ≈9.5 px/mm; Apple Watch is ≈326 ppi ≈ 12.8 px/mm (cross-checked: 41mm = 352x430 px over a 904 mm² display → 12.9), so 1px ≈ 0.078mm and every physical-size claim was off by a third. Consequence: an integer snap gives 3px = 0.234mm = 71% or 4px = 0.312mm = 95% of the EAN-13 nominal 0.33mm, and the ISO 15420 80% floor needs 115x4 = 460px — which NO watch has on its short axis and only 45/46/49mm have on the long axis. (2) SO THE ORIGINAL AC2 ("never render below 80% magnification… must be refused rather than drawn") WOULD HAVE BLANKED THE BARCODE ON MOST OF THE SUPPORTED LINE-UP. Rewritten to "maximise the integer module, record the magnification achieved, NEVER refuse to draw" — the 80% floor is a PRINT spec calibrated for ink spread on paper read by laser at distance, and an emissive high-contrast screen read at 10cm is a different regime (which is why scanning off phone screens works at sizes print rejects). Uniformity and contrast are the levers; SIZE IS NOT. (3) 16-23's 2.83 px/module threshold is VISION-SPECIFIC and must NOT be quoted as governing a checkout scanner — POS lanes run Datalogic/Zebra firmware on an analog reflectance waveform, far more tolerant than Vision. The MECHANISM transfers (integer snapping makes physically unequal bars; every 1D decoder normalises against the narrow element), the NUMBER does not. ALSO FOUND, now ACs: ⚠️ A SEAM BUG THAT WOULD HAVE SILENTLY DEFEATED THE WHOLE FIX — updateBarcodeTargetSize rounds the target DOWN (BarcodeFlashView.swift:146-149) while the .frame() at :40 uses the UNROUNDED layout.barcodeSize, so SwiftUI rescales by a fraction of a pixel and .interpolation(.none) resolves it by DUPLICATING A PIXEL COLUMN, reintroducing the exact ±1px jitter the story exists to remove (now AC7). THE QR PATH ALREADY IMPLEMENTS THE FIX — renderQRCodeImage does floor(min(widthPx/extent, heightPx/extent)) and centres (:392-395, :425-431), so this is a consistency fix with a working in-repo precedent, not a new design (now cited in AC1). THE NAV BAR IS EATING THE ROTATION BUDGET — :102 sets .navigationTitle and the GeometryReader does not ignore safe area, so the title bar consumes exactly the long-axis height rotation depends on; hiding it is the cheapest space win and the most literal answer to ifero's original "use as much space as possible" (now AC6). Rotation predicate must be STABLE (hysteresis or a non-oscillating input) or a fractional geometry wobble flips orientation mid-view (AC3). Boundaries now defined rather than discovered in the field: oversized Code128 (a 20-char alphanumeric is ≈250 modules, illegible at any orientation), short payloads (EAN-8 is 67 modules — GROW the module, do not leave the space blank), and the hardcoded 156x88 barcodeTargetSize default at :13 which makes the first render wrong-sized and, once rotation exists, visibly flips on appear (AC9). AC10 records the rotation ASSUMPTION under test: flatbed lanes (Datalogic Magellan, Zebra MP7000) are omnidirectional and do not care, but a SINGLE-LINE HANDHELD LASER DOES — if the field contradicts AC3, the predicate is what changes. ⚠️ THE px/module TABLE ALSO ASSUMES geometry.size.width ≈ full screen width, which the safe area and the nav bar make OPTIMISTIC — treat it as a LOWER BOUND on the problem and re-measure on device as the first implementation task.
  16-28-watch-real-symbologies-ean8-upca-code39: done # 2026-08-02: NOT a field report — found while investigating ifero's watch-scannability complaint, and WRITTEN DOWN AT IFERO'S EXPLICIT REQUEST ("we need to write it down otherwise it gets lost"). DEFECT: BarcodeGenerator.swift:57-59 maps three of the six supported formats onto a fourth — `case .EAN8, .UPCA, .CODE39: modules = encodeCode128(value: value)`, commented "pragmatic fallback: render as Code128 so scanners can still read it". Introduced 2026-02-16 in 1d6cf7f and unchanged since. The watch draws a VALID Code128 SYMBOL CARRYING THE RIGHT DIGITS UNDER THE WRONG SYMBOLOGY: a POS lane expecting EAN-8 with Code128 disabled for loyalty rejects it outright, and one that accepts it reports a different symbology identifier than the same card scanned off the plastic. This is a direct, concrete cause of "the checkout scanner doesn't recognise the barcodes from the apple watch". The file's own doc comment concedes it — "Supports EAN-13, Code128, and QR" (:37-38) — while the enum advertises six (:15-22). ⚠️ CORRECTS A STALE CLAIM IN THIS TRACKER: story 10-4's note says these formats "fall through leaving `modules` nil and generateImage returns nil", so "an EAN-8 card shows NOTHING on Apple Watch today". That was true BEFORE 1d6cf7f; current behaviour is the Code128 substitution, which is harder to notice and arguably worse. WORK: real encoders for EAN-8 (8 digits, own check-digit weighting), UPC-A (12 digits — NOT EAN-13-with-leading-zero at the module level, even though it decodes as such) and Code39 (alphanumeric, `*` delimiters, different module structure), each following encodeEAN13's existing contract of returning nil on checksum mismatch (:95-107) so a corrupt payload fails visibly. nil must fall back to the existing value-text placeholder (BarcodeFlashView.swift:167-183) for manual keying — substituting another symbology is the defect being removed. Unit vectors from published reference symbols, not from this implementation's own output, in watch-ios/Tests/BarcodeGeneratorTests.swift. The six-format contract (core/schemas/card.ts:16-23) is a cross-platform sync contract and is NOT changed here. Wear OS (10-4) sidesteps all of this via ZXing, which covers all six natively — this closes the watchOS side of the same gap. NATIVE → NOT OTA-eligible. SEQUENCE: land 16-27 FIRST so the new encoders are written against the corrected renderer (shared file, and AC7 makes these formats inherit the integer-snap + rotation predicate). ⚠️ WATCH STORY 16-25 (map UPC-E instead of storing it as Code 128, drafted concurrently on `docs/16-25-map-upce-story`, commit 8b10f4f) — IT IS THE PHONE-SIDE SIBLING OF THIS DEFECT: a UPC-E scan is STORED with barcodeFormat CODE128 because BARCODE_FORMAT_MAP has no `upc_e` key, whereas THIS story is about correct RENDERING of formats already stored correctly. Complementary, not duplicates — but WHICH OPTION 16-25 PICKS CHANGES THIS STORY'S SCOPE: its option (a) adds UPCE to barcodeFormatSchema and would require a FOURTH encoder here; its recommended option (b) expands UPC-E to its 12-digit UPC-A parent and needs nothing extra. CONFIRM WHICH OPTION LANDED BEFORE SIZING. Note both stories independently found and corrected the same stale Story 10-4 claim about EAN8/CODE39/UPCA rendering nothing — that is corroboration, not duplication.
  16-29-watch-card-list-brand-logos: ready-for-dev # 2026-08-02: requested by ifero — "we should be showing the brands on the watch instead of the initials while showing the list of cards (when the brand exists)". CHEAPEST OF THE FOUR: MOST OF IT ALREADY EXISTS IN THE WRONG TARGET. The watch COMPLICATION already renders real logos — targets/watch-widget/Assets.xcassets ships 56 BrandLogo-*.imageset assets covering ALL 56 catalogue brands (verified: 56 imagesets, catalogue/italy.json has 56 brands), resolved via BrandLogoCatalog (targets/watch-widget/BrandLogoCatalog.swift) with assetName(for:) plus prefersDarkBacking(for:) for light artwork, backed by knownBrandIds/lightLogoBrandIds in Generated/BrandLogoCatalog.generated.swift. Both generated files come from watch-ios/Scripts/generate-catalogue.swift, which reads catalogue/italy.json AND the imageset folder so they cannot drift. The watch APP has none of it: targets/watch/Assets.xcassets holds only AccentColor.colorset + AppIcon.appiconset, and CardRowView.logoView (CardListView.swift:369-393) draws initials(from:) on a brand-coloured circle. SO THIS IS AN ASSET/TARGET-MEMBERSHIP PROBLEM, NOT A DESIGN PROBLEM. Target avatar is 30pt (WatchCardRowLayoutMetrics.compact, WatchPresentationLayout.swift:31) clipped to Circle() (CardListView.swift:334-335). KEEP initials on TWO paths: custom cards (brandId nil, the else branch at :381-392) AND catalogue brands with no bundled imageset — BrandLogoCatalog.normalized(_:) already gates on knownBrandIds and returns nil for unknown, so that branch is real even at 56/56 today (a brand added to italy.json without a PNG must degrade to initials, not an empty circle). Reuse prefersDarkBacking rather than re-deriving it: the row background is #1C1C1F (:359) so white-on-transparent logos would vanish. Accent bar (:329-331), favourite star (:347-352) and the combined-element accessibility label via cardRowAccessibilityKey (:283-287, :366) all UNCHANGED — the logo is decorative and must not add a second VoiceOver element. Extend generate-catalogue.swift to emit for BOTH targets rather than hand-copying 56 imagesets (watch app and widget are separate targets with separate catalogues; @bacons/apple-targets generates the project from folder layout so membership follows the files). MEASURE the watch app binary-size increase — 56 imagesets into a target that has none. ⚠️ expo prebuild REWRITES tracked files inside the watch target's asset catalogue (the AppIcon Contents.json is a known case, .prettierignore'd for exactly that reason) — confirm which files under targets/watch/Assets.xcassets are prebuild-owned before putting generated content beside them. Update the add-a-brand checklist so a future brand can't ship with a complication logo and an initials-only list row. NATIVE → NOT OTA-eligible. INDEPENDENT of 16-26/26/27 — touches CardListView.swift, the asset catalogues and the generator script, none of which those three edit; can run in parallel or ship first. Out of scope: changing logo artwork, and logos on the barcode flash screen.
  16-35-ship-wear-os-apk-to-play: done # 2026-08-26: FIELD REPORT from ifero — "I've released to internal testers the newest app version and the wear os app hasn't been delivered." INVESTIGATED IN PARTY MODE (dev + architect) AND ACTIONED IN THE SAME PASS. NOT A REGRESSION — there is nothing to bisect: the Wear OS app has NO release or upload path and never has. beta-releases.yml has exactly two jobs (ios-testflight-beta, android-beta) and neither mentions watch-android; wear-os-build.yml runs `testDebugUnitTest assembleDebug` (DEBUG, UNSIGNED, never uploaded) and is path-filtered to watch-android/** so it does not even run on an RC tag — a green board that proves compilation and IMPLIES delivery. PROOF IS A GREP: WEAR_VERSION_CODE, the var watch-android/app/build.gradle.kts reads for its versionCode, exists in exactly two places in the repo (that build file + the README table). No workflow sets it. Epic 10 closed 2026-08-20 with the release path parked in watch-android/README.md § Signing, Play and Asset Links: "Documented here, not configured here." ⚠️ THE NAIVE FIX UN-DELIVERS THE PHONE: the Wear APK shares applicationId, so Play sees ONE app whose track release must list BOTH version codes — a second independent upload_to_play_store call creates a NEW release and the phone's code silently drops out (Story 16.7 failure class). Compounded: fastlane supply takes an APK OR an AAB, not both, and multiple AABs are unsupported; phone ships AAB, Wear ships APK. Working mechanism = second call with skip_upload_aab + version_codes_to_retain, SAME JOB (parallel jobs race the Play track edit). SCOPE CHOSEN BY IFERO (wider on both forks): fix BETA **and** PRODUCTION, and VERIFY THE SIGNING CERT. Production forces a 4th versionCode band — GITHUB_RUN_NUMBER is per-workflow-file, so both pipelines at 2_000_000+run would collide; Wear production moves to 3_000_000+run, offset declared in build.gradle.kts and applied in YAML exactly as PRODUCTION_VERSION_CODE_OFFSET already is. Signing: inject the phone keystore, then apksigner verify --print-certs and fail on a cert-SHA-256 mismatch — a wrong-key APK uploads cleanly and breaks the Wearable Data Layer SILENTLY (no crash, and Sentry has ~0 Android coverage). Also adds assembleRelease to wear-os-build.yml: R8 full mode has never run on this app and proguard-rules.pro says so in its own header. OUT OF SCOPE: Digital Asset Links publication (@ifero, Play Console), Wear store-listing assets, promoting the draft, lintDebug in CI, monochrome icon. ⚠️ AC9 IS THE REAL GATE — whether version_codes_to_retain composes with an existing DRAFT release is Play Console behaviour and CANNOT be proven from this repo; the alpha release must be confirmed to list two version codes on a real RC.
