    story 16-22 (fix the Android card-grid tile overlap) joins the sprint as `wave_0b`, on the
    same independent Epic 16 track as wave_0. `stories`, `waves`, `name` and `goal` were ALL
    amended in the same pass — not just the story list — which is the second consecutive time
    this sprint block has been kept honest when scope moved (see the reconciliation action item
    below; note this pass came from create-story + an explicit sprint-assignment request, NOT
