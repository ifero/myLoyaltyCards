current_sprint:
  number: 19
  name: 'Sprint 19: Apple Watch Barcode Quality & Lint Debt'
  goal: 'Close the quality gap the Wear OS launch exposed on Apple Watch. Wear OS now renders all six barcode symbologies correctly; the Apple Watch draws a Code128 symbol for three formats that are not Code128 (EAN-8, UPC-A, Code39), quantises 1-module bars to two different pixel widths, dims mid-scan, and shows initials where the complication already shows real brand logos. Four ready-for-dev stories fix all of that, plus 16-24 clears the exhaustive-deps warning backlog on an independent JS/TS track.'
  status: in-progress # PLANNED 2026-08-20 at the Sprint 18 close / Epic 10 retrospective; moved planned → in-progress on 2026-08-26 when 16-35 (mid-sprint addition, see wave_0) was drafted and implemented in one pass. Story 16-28 (wave_1) started 2026-08-25; 16-34 was added 2026-09-01 as its follow-up. Every story in it is `ready-for-dev` or beyond WITH a refined story file, so nothing is waiting on refinement — unlike the Epic 14 block this replaced.
  planning_date: 2026-08-20
  epics: [16]
  stories:
    - 16-35-ship-wear-os-apk-to-play
    - 16-28-watch-real-symbologies-ean8-upca-code39
    - 16-29-watch-card-list-brand-logos
    - 16-27-fix-watch-barcode-geometry
    - 16-26-hold-watch-display-luminance
    - 16-24-clear-exhaustive-deps-warnings
  waves:
    wave_0:
      stories: [16-35]
      note: 'MID-SPRINT ADDITION 2026-08-26, from a field report by ifero ("I''ve released to internal testers the newest app version and the wear os app hasn''t been delivered"). Sequenced AHEAD of the whole Apple Watch chain and fully independent of it — it touches only .github/workflows/, fastlane/Fastfile, watch-android/ and docs/, while waves 1-3 touch targets/watch/*.swift. No shared file, no dependency either way. NOT a regression and NOT a defect in the Wear OS app: there is no release or upload path for watch-android at all, so no RC has ever carried the watch half. Read the story banner before touching YAML — the obvious fix (a parallel wear upload job) DROPS THE PHONE from the Play release, because the shared applicationId means one track release must list both version codes and fastlane cannot upload an AAB and an APK in one call. Drafted and implemented in the same pass (party mode, dev + architect), so it enters the sprint at `review` rather than `ready-for-dev`. ⚠️ Its AC9 cannot be satisfied from the repository — the two-version-code alpha release must be confirmed on a real RC in the Play Console.'
    wave_1:
      stories: [16-28, 16-29]
      note: "Parallel-safe — verified by file overlap, not assumed. 16-28 owns `targets/watch/BarcodeGenerator.swift`; 16-29 owns `targets/watch/CardListView.swift`, `targets/watch/Generated/Brands.swift` and `targets/watch-widget/BrandLogoCatalog.swift`. No shared file. 16-28 goes FIRST in the barcode chain because it changes what the generator PRODUCES (real module arrays for EAN-8/UPC-A/Code39, which today render nothing because `BarcodeGenerator.swift:57` leaves `modules` nil), so 16-27's quantisation fix then applies to all six formats instead of three. 16-29 is the cheapest win in the sprint: Story 10-2 verified the 57 BrandLogo-* imagesets already exist in `targets/watch-widget/Assets.xcassets` covering all 57 catalogue brands — the assets are in the wrong target, not missing."
    wave_2:
      stories: [16-27]
      note: 'Sequenced AFTER 16-28: both edit `targets/watch/BarcodeGenerator.swift`, so they are not parallel-safe. Root cause per the story is quantisation, not margins — `BarcodeGenerator` renders 1-module bars at two different pixel widths, which is why reducing margins alone would not fix scannability. Also touches `BarcodeFlashView.swift` and `WatchPresentationLayout.swift`.'
    wave_3:
      stories: [16-26]
      note: 'Sequenced AFTER 16-27: both edit `targets/watch/BarcodeFlashView.swift`. Note the story title is NOT literally implementable — watchOS exposes no API to force full luminance — so it delivers the closest achievable behaviour: stop the display dimming mid-scan. Read the story banner before writing code. Wear OS already solved its equivalent in Story 10-4 (screen kept awake + brightness maximised via a per-window WindowManager attribute), so the watchOS gap is now the asymmetric one.'
    parallel_track:
      stories: [16-24]
      note: 'Independent of the entire watch chain — JS/TS and ESLint config only, no Swift, no shared file. Runs throughout. ⚠️ ITS OWN BANNER IS STALE: the story says `⛔ DEPENDS ON PR #185`, but #185 (`chore(lint): enable react-hooks rules-of-hooks and exhaustive-deps`) MERGED 2026-07-31 and the rules are live in `eslint.config.mjs:68-72`. The dependency is cleared; amend the banner when picking it up. Two of the three warnings must NOT be resolved the way the rule suggests — the story explains which.'
  notes: |
    Planned 2026-08-20 at the Sprint 18 close, immediately after the Epic 10 retrospective, per
    ifero. This block REPLACES the Epic 14 (Household Collaboration) sprint staged on 2026-07-20,
    which could not be committed as written for two reasons found at planning:
      1. Its wave-2 story `14-2-card-sharing-deeplink` is now `absorbed-into-epic-18` — the scope
         moved to the share-link epic, so the staged block listed work that no longer exists.
      2. Its hard prerequisite `14-5a` (household-cards UX design) is still `backlog`. It HAS a
         story file, but a 62-line outline; Epic 14's other stubs run 88-114 lines against 206-237
         for a story genuinely in `ready-for-dev`. It needs a UX pass (`bmad-ux`) and then
         `create-story` before any implementation story can be refined. Epic 14 is deferred to
         Sprint 20, not dropped.
    WHY THIS SPRINT INSTEAD. Every story here is already `ready-for-dev` with a refined story file,
    so the sprint starts with zero refinement gate. More importantly it fixes a LIVE user-facing
    defect in shipped software: EAN-8, UPC-A and Code39 render NOTHING on Apple Watch today
    (surfaced by Story 10-4, which had to build the ZXing-equivalent Kotlin maths to notice). The
    Wear OS launch made the asymmetry concrete and visible — the new platform does six symbologies
    correctly while the older one does three.
    SEQUENCING IS FILE-DERIVED, NOT GUESSED. The four watch stories are NOT parallel-safe: 16-27
    and 16-28 both edit `BarcodeGenerator.swift`, and 16-26 and 16-27 both edit
    `BarcodeFlashView.swift`. Only 16-29 is fully independent. Hence 16-28 -> 16-27 -> 16-26 as a
    chain with 16-29 alongside, rather than a single four-story wave.
    VALIDATION CONSTRAINT — inherited from the Epic 10 retro, read before starting. These are
    watchOS rendering and scanning changes, and the Epic 10 retro (DEC-E10-RETRO-001) closed with
    on-device validation NOT performed and the risk accepted. Barcode scannability cannot be proven
    in the Simulator: 16-27 is about physical scanner behaviour. Plan for a real Apple Watch pass on
    16-27 and 16-28 specifically, or record the same accepted risk KNOWINGLY rather than by default.
    NOT CHOSEN, and why — so the alternatives do not have to be re-derived next time:
      - SDK 57 thread (16-18..16-21): genuinely UN-GATED now that 16-17 is done, but all four are
        `backlog` with no refined story files, and a risky native upgrade immediately after a
        platform launch is poor sequencing. Strong Sprint 20/21 candidate.
      - Epic 18 (share links): blocked on the custom-domain registration, an open action item that
        only ifero can discharge (payment + registrar account).
      - Wear OS field observability (Epic 10 retro action item 1, `critical-path`): real and
        unstoried. Not in this sprint because it needs `create-story` first; it belongs in Sprint 20
        alongside the SDK work, or sooner if a Wear OS field failure is ever suspected — which, with
        no crash reporting on `watch-android`, would currently be by user report only.
      - 16-25 (UPC-E mapping): thematically adjacent barcode-correctness work, held back because the
        story carries an unresolved `Decision required` for ifero and asks that Sentry be checked
        before sizing. Fold it in mid-sprint if that decision lands.
      - 16-16 (FormatJS polyfill): ready-for-dev and independent; available as a fast-follow.

