    wave_0b:
      stories: [16-22]
      note: 'MID-SPRINT ADDITION 2026-07-29, at ifero''s explicit priority ("it''s important"): Epic 16 card-grid tile overlap fix. Same independent Epic 16 track as wave_0 — no shared files and no dependency either way with the Wear OS chain (16-22 touches features/cards/ on the phone; Epic 10 builds a new Wear OS module), so it runs in parallel and is sequenced AHEAD of wave_1. Story file exists and is `ready-for-dev` — unlike every Epic 10 story, this one is NOT gating. Rationale for the priority: the defect makes the phone home screen unreadable at 360 dp, the most common Android portrait width, and Epic 10 is about to put this project in front of far more Android users. JS-only, so it is OTA-eligible and does not need to wait for a native build. Its own AC7 requires on-device verification at 360 dp and 320 dp in both themes — a dev build suffices (no native change), so it does not inherit 16-17''s release-build constraint.'
    wave_0c:
      stories: [16-23]
      note: 'MID-SPRINT ADDITION 2026-07-30 per ifero: Epic 16 barcode-scan observability fix, raised as "this barcode is not recognised by the library" with a Penny Market card image. Third story on the same independent Epic 16 track as wave_0/wave_0b — no shared files and no dependency either way with the Wear OS chain, so it runs in parallel and is sequenced AHEAD of wave_1. NOTE the overlap with wave_0b: 16-22 touches features/cards/ (CardTile/CardList grid maths) while 16-23 touches features/add-card/hooks/useImageScan.ts plus features/cards/hooks/useBarcodeScanner.ts — DIFFERENT files in the same two features, so they are parallel-safe, but both edit shared/i18n/locales/en.ts + it.ts and are therefore likely to conflict there on merge; land them in wave order (16-22 first) or expect a trivial locale rebase. Story file exists and is `ready-for-dev`; NOT gating. JS/TS + JSON + locales only → OTA-eligible, so it does not wait on a native build — but its AC1 reproduction needs a REAL DEVICE because Jest mocks both barcode decoders, so a green suite proves nothing (the 16.15 lesson, written into the ACs).'
