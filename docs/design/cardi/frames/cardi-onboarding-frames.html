<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardì — onboarding, five frames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ==================================================================
         SHARED FRAME LAYER — extracted VERBATIM from
         cardi-card-detail-frames.html by scratchpad/gen_onboarding.py, so the
         token values cannot drift. Copied rather than linked, because any
         viewer that inlines the HTML drops a linked stylesheet.
         ================================================================== */

      :root {
        --ink: #181824;
        --beam: #fccc0c;
        --cream: #f0f0e8;
        --white: #ffffff;
        --hairline: #d6d6cb;
        --placeholder: #55555f;
        --error: #c41e1e;

        --swatch-red: #e42424;
        --swatch-blue: #0c3c84;
        --swatch-azure: #0c84cc;
        --swatch-green: #0c843c;
        --swatch-yellow: #fccc0c;

        /* TWO margins, deliberately. 24px is the SINGLE-COLUMN margin — forms,
           settings, documents. The card grid uses 16px, and that is not a style
           choice: TILE_WIDTH 171 in features/cards/utils/gridLayout.ts is
           (390 − 2×16 − 16) / 2, frozen with tests. At 24px the tile stops being 171.
           The design system currently states one figure and needs amending. */
        --screen-margin: 24px;
        --grid-margin: 16px;
        --gutter: 16px;

        --touch: 48px;
        --radius-control: 12px;
        --radius-tile: 16px;
        --safe-top: 59px;
        --safe-bottom: 34px;
        --header-h: 56px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #c9c9c2;
        font-family: Inter, system-ui, sans-serif;
        padding: 48px 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 48px;
        justify-content: center;
        align-items: flex-start;
      }

      .plate {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .plate figcaption {
        font:
          600 12px/1.4 Inter,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #3d3d46;
      }

      /* ---- the frame: exactly 393 x 852, never anything else ---- */
      .frame {
        width: 393px;
        height: 852px;
        background: var(--cream);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* Reserved system insets — 59px top / 34px bottom, the real values for a
         393 x 852 Dynamic Island device.

         These were originally left blank. That was a mistake of presentation, not of
         measurement: on a real phone the top inset is OCCUPIED by the clock and
         indicators, so drawing it empty makes a correct 59px read as careless
         padding, and invites the exact wrong fix (shrink it — which would push
         content under the live status bar at build time).

         The status bar is SYSTEM chrome, not ours: ink only, no beam, and nothing
         here is a control. Same for the home indicator. */
      .safe-top {
        height: var(--safe-top);
        flex: 0 0 auto;
      }

      .safe-bottom {
        height: var(--safe-bottom);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .statusbar {
        height: 100%;
        padding: 14px var(--screen-margin) 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
      }

      .statusbar .clock {
        font-family: Inter, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }

      .statusbar .indicators {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .statusbar svg {
        display: block;
        fill: currentColor;
      }

      .home-indicator {
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: var(--ink);
        opacity: 0.85;
      }

      /* ---- header ----
         A three-column grid: a 48px touch target, the title, a 48px touch target.
         Icons are optically aligned, not box-aligned — a glyph drawn inside a square
         icon box carries empty side bearing, so box-aligning it to the margin leaves
         the visible stroke sitting inboard of the content beneath. The fix is to
         bleed the touch target to the frame edge and pad the content back to the
         margin: ink lands on the margin, the target stays 48px. */
      .header {
        height: var(--header-h);
        flex: 0 0 auto;
        padding: 0 var(--screen-margin);
        display: grid;
        grid-template-columns: var(--touch) 1fr var(--touch);
        align-items: center;
      }

      .header.grid-margin {
        padding: 0 var(--grid-margin);
      }

      .icon-target {
        width: var(--touch);
        height: var(--touch);
        display: flex;
        align-items: center;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--ink);
      }

      .icon-target.at-start {
        margin-left: calc(-1 * var(--screen-margin));
        padding-left: var(--screen-margin);
        justify-content: flex-start;
      }

      .icon-target.at-end {
        margin-right: calc(-1 * var(--screen-margin));
        padding-right: var(--screen-margin);
        justify-content: flex-end;
      }

      .header.grid-margin .icon-target.at-start {
        margin-left: calc(-1 * var(--grid-margin));
        padding-left: var(--grid-margin);
      }

      .header.grid-margin .icon-target.at-end {
        margin-right: calc(-1 * var(--grid-margin));
        padding-right: var(--grid-margin);
      }

      .icon-target svg {
        display: block;
      }

      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        text-align: center;
        color: var(--ink);
      }

      /* ---- body ---- */
      .body {
        flex: 1 1 auto;
        min-height: 0;
        padding: 24px var(--screen-margin) 0;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .body.grid-margin {
        padding: 8px var(--grid-margin) 0;
        gap: 16px;
      }

      /* ---- footer ----
         A flex sibling AFTER the scroll area. Never fixed, never absolute — so it
         cannot fight the keyboard. The gap above it is composition, not absence. */
      .footer {
        flex: 0 0 auto;
      }

      .hairline {
        height: 1px;
        background: var(--hairline);
        width: 100%;
      }

      .footer-inner {
        padding: var(--screen-margin);
      }

      .footer-inner.grid-margin {
        padding: var(--grid-margin);
      }

      .btn-primary {
        width: 100%;
        height: 52px;
        background: var(--ink);
        color: var(--white);
        border: 0;
        border-radius: var(--radius-control);
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ------------------------------------------------------------------
         Cardì — the PITCH pattern: the first ninety seconds.

         Specced from WelcomeScreen / ModeSelectionScreen /
         FeatureHighlightsScreen and their components — see
         stitch-prompts-onboarding.txt.

         THIS IS THE ONLY FLOW WITH NO USER CONTENT IN IT, AND THAT CHANGES
         WHAT THE PALETTE IS FOR.

         Everywhere else the rule is "the content is the colour": 45 brand
         colours are the content, so our chrome stays quiet and beam is
         rationed to almost nothing. Here there are no cards yet. Nothing is
         competing. The quiet was protecting something that is not there.

         So this is where the brand speaks in its own voice — and the design
         system already licensed exactly that in a line nobody had applied:
         "Illustrations: flat, two-tone (ink line-work on cream) with beam
         yellow as the single accent." One beam element per drawing, never two.

         WHAT WAS THERE BEFORE: four placeholders, all monochrome alpha-tints
         of theme.primary assembled from plain Views — three offset rects on
         welcome (no rotation, so not a fan), a circle of four rects, a circle
         with a rect and seven bars, and one that is just MaterialIcons
         verified-user at 60px. Wave B was never blocked on inventing an
         illustration system; the slots already existed at known sizes.

         AND THE HIGHEST-LEVERAGE FIX IS NOT A DESIGN QUESTION: BrandedIcon
         defaults to MaterialIcons 'credit-card', so the screen introducing a
         brand whose whole ornament is the ì shows stock clip art. Missing
         asset, not a styling choice.
         ------------------------------------------------------------------ */

      .pitch {
        flex: 1 1 auto;
        min-height: 0;
        padding: 0 var(--screen-margin);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .centre {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* THE MARK. Constructed from a stem and an accent rather than set as the
         character "ì", because the accent has to carry its own colour and no
         font lets you paint half a glyph. It is a logotype: constructing it is
         the honest way, not a workaround. */
      .mark {
        border-radius: 999px;
        background: var(--ink);
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        flex: 0 0 auto;
      }

      .mark-stem {
        width: 10px;
        border-radius: 2px;
        background: var(--white);
        margin-bottom: 26px;
      }

      /* At rest a dot, in motion a beam — so the accent is a stroke, not a dot. */
      .mark-accent {
        position: absolute;
        width: 17px;
        height: 6px;
        border-radius: 2px;
        background: var(--beam);
        transform: rotate(-22deg);
        left: 50%;
        margin-left: -12px;
        top: 26px;
      }

      .pitch-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 34px;
        line-height: 40px;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      /* The spec asked for the wordmark's grave accent in beam too. Drawing it
         proved that wrong: beam on cream fails contrast, which is why the design
         system pairs beam with ink and never with cream. The accent stays ink
         here and the beam lives on the mark, where it sits on ink. One accent,
         on the surface that can carry it. */
      .pitch-sub {
        font-family: Inter, sans-serif;
        font-size: 17px;
        line-height: 24px;
        color: var(--placeholder);
      }

      .pitch-h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .pitch-body {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      .illo-fan {
        display: block;
      }

      /* The three carousel illustrations share one slot: a 160px cream disc with
         a hairline, so the drawing sits ON the system rather than in a tinted
         bubble of primary at 10% alpha. */
      .illo-disc {
        width: 160px;
        height: 160px;
        border-radius: 999px;
        background: var(--cream);
        border: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .link-plain {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 15px;
        color: var(--ink);
        height: var(--touch);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .link-underline {
        text-decoration: underline;
      }

      /* ---- mode option cards ----
         The shipped recommended card uses a 2px border AND a 5% ink wash. The
         wash goes: every card in this app is white on cream, and a border weight
         plus one beam pill is enough to carry a recommendation without making
         the other option look broken. */
      .opt {
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-tile);
        padding: 20px;
        position: relative;
      }

      .opt.is-recommended {
        border: 2px solid var(--ink);
      }

      .opt-row {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }

      .opt-tile {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: var(--cream);
        border: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        flex: 0 0 auto;
      }

      .opt-copy {
        flex: 1;
        min-width: 0;
      }

      .opt-copy h3 {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        line-height: 24px;
        color: var(--ink);
      }

      .opt-copy p {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
        margin-top: 4px;
      }

      /* 13/600/0.02em is label-bold, the smallest legitimate size in this system
         — and it is a LABEL. The shipped eyebrow was 12px and the badge 12px,
         both below the 15px body minimum and off the scale entirely. */
      .opt-copy .eyebrow {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 13px;
        line-height: 18px;
        letter-spacing: 0.02em;
        margin-top: 8px;
        color: var(--ink);
      }

      .opt-copy .eyebrow.muted {
        color: var(--placeholder);
      }

      .badge {
        position: absolute;
        top: -11px;
        right: 16px;
        background: var(--beam);
        color: var(--ink);
        border-radius: 999px;
        padding: 4px 12px;
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 13px;
        line-height: 18px;
        letter-spacing: 0.02em;
      }

      /* ---- the sheet ---- */
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 400px;
        background: var(--white);
        border-radius: var(--radius-tile) var(--radius-tile) 0 0;
        display: flex;
        flex-direction: column;
        padding: 0 var(--screen-margin);
      }

      .grab {
        width: 36px;
        height: 4px;
        border-radius: 999px;
        background: var(--hairline);
        margin: 12px auto 0;
      }

      .sheet h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        margin-top: 24px;
      }

      .sheet p {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--ink);
        margin-top: 16px;
      }

      .sheet-foot {
        margin-top: auto;
        padding-bottom: 0;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
      }

      .behind {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }

      /* ---- pagination ---- */
      .dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .dots i {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--hairline);
      }

      .dots i.on {
        background: var(--ink);
      }

      .skip-row {
        display: flex;
        justify-content: flex-end;
        padding-top: 8px;
        flex: 0 0 auto;
      }

      /* Centred in the space between Skip and the footer. Pinned to the top it
         left a ~200px void above the dots — a carousel slide should sit in its
         own frame, not hang from the ceiling. */
      .centre.fill {
        flex: 1 1 auto;
        min-height: 0;
        justify-content: center;
      }

      .pitch-foot {
        margin-top: auto;
        padding-bottom: 24px;
      }
    </style>
  </head>
