<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardì — card detail, four frames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ==================================================================
         SHARED FRAME LAYER — the same tokens and frame primitives as the form,
         wallet, settings, document and barcode frame files. Keep the VALUES in
         step; copied rather than linked, because any viewer that inlines the
         HTML drops a linked stylesheet and renders a broken frame.
         cardi-design-system.md is the source of truth for these values.
         ================================================================== */

      :root {
        --ink: #181824;
        --beam: #fccc0c;
        --cream: #f0f0e8;
        --white: #ffffff;
        --hairline: #d6d6cb;
        --placeholder: #55555f;
        --error: #c41e1e;

        --swatch-red: #e42424;
        --swatch-blue: #0c3c84;
        --swatch-azure: #0c84cc;
        --swatch-green: #0c843c;
        --swatch-yellow: #fccc0c;

        /* TWO margins, deliberately. 20px is the SINGLE-COLUMN margin — forms,
           settings, documents. The card grid uses 16px, and that is not a style
           choice: TILE_WIDTH 171 in features/cards/utils/gridLayout.ts is
           (390 − 2×16 − 16) / 2, frozen with tests. At 20px the tile stops being 171.
           The design system currently states one figure and needs amending. */
        --screen-margin: 20px;
        --grid-margin: 16px;
        --gutter: 16px;

        --touch: 48px;
        --radius-control: 12px;
        --radius-tile: 16px;
        --safe-top: 59px;
        --safe-bottom: 34px;
        --header-h: 56px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #c9c9c2;
        font-family: Inter, system-ui, sans-serif;
        padding: 48px 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 48px;
        justify-content: center;
        align-items: flex-start;
      }

      .plate {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .plate figcaption {
        font:
          600 12px/1.4 Inter,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #3d3d46;
      }

      /* ---- the frame: exactly 393 x 852, never anything else ---- */
      .frame {
        width: 393px;
        height: 852px;
        background: var(--cream);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* Reserved system insets — 59px top / 34px bottom, the real values for a
         393 x 852 Dynamic Island device.

         These were originally left blank. That was a mistake of presentation, not of
         measurement: on a real phone the top inset is OCCUPIED by the clock and
         indicators, so drawing it empty makes a correct 59px read as careless
         padding, and invites the exact wrong fix (shrink it — which would push
         content under the live status bar at build time).

         The status bar is SYSTEM chrome, not ours: ink only, no beam, and nothing
         here is a control. Same for the home indicator. */
      .safe-top {
        height: var(--safe-top);
        flex: 0 0 auto;
      }

      .safe-bottom {
        height: var(--safe-bottom);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .statusbar {
        height: 100%;
        padding: 14px var(--screen-margin) 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
      }

      .statusbar .clock {
        font-family: Inter, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }

      .statusbar .indicators {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .statusbar svg {
        display: block;
        fill: currentColor;
      }

      .home-indicator {
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: var(--ink);
        opacity: 0.85;
      }

      /* ---- header ----
         A three-column grid: a 48px touch target, the title, a 48px touch target.
         Icons are optically aligned, not box-aligned — a glyph drawn inside a square
         icon box carries empty side bearing, so box-aligning it to the margin leaves
         the visible stroke sitting inboard of the content beneath. The fix is to
         bleed the touch target to the frame edge and pad the content back to the
         margin: ink lands on the margin, the target stays 48px. */
      .header {
        height: var(--header-h);
        flex: 0 0 auto;
        padding: 0 var(--screen-margin);
        display: grid;
        grid-template-columns: var(--touch) 1fr var(--touch);
        align-items: center;
      }

      .header.grid-margin {
        padding: 0 var(--grid-margin);
      }

      .icon-target {
        width: var(--touch);
        height: var(--touch);
        display: flex;
        align-items: center;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--ink);
      }

      .icon-target.at-start {
        margin-left: calc(-1 * var(--screen-margin));
        padding-left: var(--screen-margin);
        justify-content: flex-start;
      }

      .icon-target.at-end {
        margin-right: calc(-1 * var(--screen-margin));
        padding-right: var(--screen-margin);
        justify-content: flex-end;
      }

      .header.grid-margin .icon-target.at-start {
        margin-left: calc(-1 * var(--grid-margin));
        padding-left: var(--grid-margin);
      }

      .header.grid-margin .icon-target.at-end {
        margin-right: calc(-1 * var(--grid-margin));
        padding-right: var(--grid-margin);
      }

      .icon-target svg {
        display: block;
      }

      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        text-align: center;
        color: var(--ink);
      }

      /* ---- body ---- */
      .body {
        flex: 1 1 auto;
        min-height: 0;
        padding: 24px var(--screen-margin) 0;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .body.grid-margin {
        padding: 8px var(--grid-margin) 0;
        gap: 16px;
      }

      /* ---- footer ----
         A flex sibling AFTER the scroll area. Never fixed, never absolute — so it
         cannot fight the keyboard. The gap above it is composition, not absence. */
      .footer {
        flex: 0 0 auto;
      }

      .hairline {
        height: 1px;
        background: var(--hairline);
        width: 100%;
      }

      .footer-inner {
        padding: var(--screen-margin);
      }

      .footer-inner.grid-margin {
        padding: var(--grid-margin);
      }

      .btn-primary {
        width: 100%;
        height: 52px;
        background: var(--ink);
        color: var(--white);
        border: 0;
        border-radius: var(--radius-control);
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ------------------------------------------------------------------
         Cardì — the card detail screen. The barcode's immediate parent, and
         the only scroll-linked screen in the app.

         Specced from features/cards/screens/CardDetailScreen.tsx and
         CardDetails / BrandHero / DetailRow — see
         stitch-prompts-card-detail.txt.

         THE HEADER FOLLOWS THE BRAND — AS A TRANSITION, NOT A TINT.

         An earlier version of this file made the header cream at every scroll
         position, arguing that the header is navigation and navigation should
         not wear a third-party brand's colour. That cut a horizontal cream band
         straight across the top of the hero, so the brand block read as
         interrupted rather than as one field. ifero rejected it, correctly.

         What that argument was actually protecting against is narrower than the
         rule it produced: brand-coloured chrome with NOTHING BENEATH IT to
         identify. That only happens once the hero has scrolled away. So:

           at rest     the header IS the brand colour, seamless with the hero.
                       The field runs from the status bar down, with no seam.
           blending    once the hero has gone, the brand fades out over cream
                       and the title fades in.
           condensed   cream plus a hairline. There is nothing left for the
                       colour to identify.

         THE ORDER MATTERS. The header stays matched to the hero for as long as
         ANY hero is visible — they are one field, and a header a shade paler
         than the band beneath it reads as a rendering mistake, not a
         transition. The blend belongs to the tail of the scroll, after the
         band is gone. An earlier draft blended them in parallel and looked
         broken.

         The endpoints are clean — full brand, or full cream — so this never
         becomes forty-five permanent pastel tints. The mid-state is one frame
         of a transition, not a resting style.

         The status bar and the header controls flip with the background's
         luminance: ink on Esselunga's yellow, white on the green accent.
         shared/theme/luminance.ts already does this, though it returns
         #1F1F24 rather than ink #181824 — a near-palette value worth fixing.

         NO HEADER SHADOW. The shipped screen sets headerShadowVisible once
         condensed. A 1px hairline does the same job and is already the
         established pattern for the anchored footer.
         ------------------------------------------------------------------ */

      .cd-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: block;
        padding: 0;
      }

      /* Full-bleed: the brand runs to both frame edges and, at rest, straight
         up into the header and status bar with no seam. */
      .hero {
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Mid-scroll: the band is being consumed from the top. */
      .hero.is-scrolled {
        height: 80px;
        align-items: flex-start;
        overflow: hidden;
      }

      .hero.is-scrolled .hero-mark {
        margin-top: -18px;
      }

      /* Stand-in for the real brand SVG from brandLogos.ts, set in the brand's
         own idiom rather than one house style — same rule as the wallet tiles. */
      .hero-mark {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 32px;
        line-height: 40px;
        letter-spacing: -0.02em;
        text-transform: lowercase;
        color: var(--white);
      }

      .hero-mark.on-light {
        color: var(--ink);
      }

      .avatar {
        width: 80px;
        height: 80px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 28px;
        color: var(--white);
      }

      .cd-inner {
        padding: 0 var(--screen-margin);
      }

      .cd-name {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin: 16px 0;
      }

      /* The condensed title: Inter, not Space Grotesk. It is a third-party
         brand's name doing navigation duty, and our display face is ours. */
      .cd-title {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        line-height: 24px;
        letter-spacing: 0;
      }

      /* A hairline, never a shadow. */
      .hdr-rule {
        height: 1px;
        background: var(--hairline);
        flex: 0 0 auto;
      }

      .card {
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-tile);
        overflow: hidden;
      }

      /* White card here, unlike the FULLSCREEN barcode where a white plate on a
         white field carries no information. On cream, and tappable, it is doing
         two jobs: separating the code and marking it interactive. */
      .bc-card {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .bc {
        display: block;
        fill: #000000;
      }

      .bc-hint {
        font-family: Inter, sans-serif;
        font-size: 13px;
        line-height: 18px;
        color: var(--placeholder);
        margin-top: 12px;
      }

      .row {
        min-height: var(--touch);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .row + .row {
        border-top: 1px solid var(--hairline);
      }

      .row .label {
        flex: 1 1 auto;
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      .row .value {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--ink);
      }

      .row .action {
        flex: 1 1 auto;
        font-family: Inter, sans-serif;
        font-size: 17px;
        line-height: 24px;
        color: var(--ink);
      }

      .row.is-destructive .action {
        color: var(--error);
      }

      .row .chev {
        color: var(--placeholder);
        display: flex;
        flex: 0 0 auto;
      }

      .sec-title {
        display: block;
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--placeholder);
        margin: 24px 0 8px;
      }

      .stack-gap {
        height: 24px;
      }
    </style>
  </head>
