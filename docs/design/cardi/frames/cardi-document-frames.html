<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardì — document pattern, three frames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ==================================================================
         SHARED FRAME LAYER — the same tokens and frame primitives as the form,
         wallet and settings frame files. Keep the VALUES in step; copied rather
         than linked, because any viewer that inlines the HTML drops a linked
         stylesheet and renders a broken frame. cardi-design-system.md is the
         source of truth for these values.
         ================================================================== */

      :root {
        --ink: #181824;
        --beam: #fccc0c;
        --cream: #f0f0e8;
        --white: #ffffff;
        --hairline: #d6d6cb;
        --placeholder: #55555f;
        --error: #c41e1e;

        --swatch-red: #e42424;
        --swatch-blue: #0c3c84;
        --swatch-azure: #0c84cc;
        --swatch-green: #0c843c;
        --swatch-yellow: #fccc0c;

        /* TWO margins, deliberately. 24px is the SINGLE-COLUMN margin — forms,
           settings, documents. The card grid uses 16px, and that is not a style
           choice: TILE_WIDTH 171 in features/cards/utils/gridLayout.ts is
           (390 − 2×16 − 16) / 2, frozen with tests. At 24px the tile stops being 171.
           The design system currently states one figure and needs amending. */
        --screen-margin: 24px;
        --grid-margin: 16px;
        --gutter: 16px;

        --touch: 48px;
        --radius-control: 12px;
        --radius-tile: 16px;
        --safe-top: 59px;
        --safe-bottom: 34px;
        --header-h: 56px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #c9c9c2;
        font-family: Inter, system-ui, sans-serif;
        padding: 48px 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 48px;
        justify-content: center;
        align-items: flex-start;
      }

      .plate {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .plate figcaption {
        font:
          600 12px/1.4 Inter,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #3d3d46;
      }

      /* ---- the frame: exactly 393 x 852, never anything else ---- */
      .frame {
        width: 393px;
        height: 852px;
        background: var(--cream);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* Reserved system insets — 59px top / 34px bottom, the real values for a
         393 x 852 Dynamic Island device.

         These were originally left blank. That was a mistake of presentation, not of
         measurement: on a real phone the top inset is OCCUPIED by the clock and
         indicators, so drawing it empty makes a correct 59px read as careless
         padding, and invites the exact wrong fix (shrink it — which would push
         content under the live status bar at build time).

         The status bar is SYSTEM chrome, not ours: ink only, no beam, and nothing
         here is a control. Same for the home indicator. */
      .safe-top {
        height: var(--safe-top);
        flex: 0 0 auto;
      }

      .safe-bottom {
        height: var(--safe-bottom);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .statusbar {
        height: 100%;
        padding: 14px var(--screen-margin) 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
      }

      .statusbar .clock {
        font-family: Inter, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }

      .statusbar .indicators {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .statusbar svg {
        display: block;
        fill: currentColor;
      }

      .home-indicator {
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: var(--ink);
        opacity: 0.85;
      }

      /* ---- header ----
         A three-column grid: a 48px touch target, the title, a 48px touch target.
         Icons are optically aligned, not box-aligned — a glyph drawn inside a square
         icon box carries empty side bearing, so box-aligning it to the margin leaves
         the visible stroke sitting inboard of the content beneath. The fix is to
         bleed the touch target to the frame edge and pad the content back to the
         margin: ink lands on the margin, the target stays 48px. */
      .header {
        height: var(--header-h);
        flex: 0 0 auto;
        padding: 0 var(--screen-margin);
        display: grid;
        grid-template-columns: var(--touch) 1fr var(--touch);
        align-items: center;
      }

      .header.grid-margin {
        padding: 0 var(--grid-margin);
      }

      .icon-target {
        width: var(--touch);
        height: var(--touch);
        display: flex;
        align-items: center;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--ink);
      }

      .icon-target.at-start {
        margin-left: calc(-1 * var(--screen-margin));
        padding-left: var(--screen-margin);
        justify-content: flex-start;
      }

      .icon-target.at-end {
        margin-right: calc(-1 * var(--screen-margin));
        padding-right: var(--screen-margin);
        justify-content: flex-end;
      }

      .header.grid-margin .icon-target.at-start {
        margin-left: calc(-1 * var(--grid-margin));
        padding-left: var(--grid-margin);
      }

      .header.grid-margin .icon-target.at-end {
        margin-right: calc(-1 * var(--grid-margin));
        padding-right: var(--grid-margin);
      }

      .icon-target svg {
        display: block;
      }

      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        text-align: center;
        color: var(--ink);
      }

      /* ---- body ---- */
      .body {
        flex: 1 1 auto;
        min-height: 0;
        padding: 24px var(--screen-margin) 0;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .body.grid-margin {
        padding: 8px var(--grid-margin) 0;
        gap: 16px;
      }

      /* ---- footer ----
         A flex sibling AFTER the scroll area. Never fixed, never absolute — so it
         cannot fight the keyboard. The gap above it is composition, not absence. */
      .footer {
        flex: 0 0 auto;
      }

      .hairline {
        height: 1px;
        background: var(--hairline);
        width: 100%;
      }

      .footer-inner {
        padding: var(--screen-margin);
      }

      .footer-inner.grid-margin {
        padding: var(--grid-margin);
      }

      .btn-primary {
        width: 100%;
        height: 52px;
        background: var(--ink);
        color: var(--white);
        border: 0;
        border-radius: var(--radius-control);
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ------------------------------------------------------------------
         Cardì — document pattern reference frames.

         Specced from features/privacy/PrivacyPolicyScreen.tsx,
         features/help/HelpScreen.tsx and features/privacy/DataSummaryScreen.tsx
         — see stitch-prompts-document.txt.

         THE MARGIN IS 24px, THE SYSTEM DEFAULT. An earlier version of this file
         used 48px and defended it as a "reading measure". That was wrong, and
         wrong in an instructive way: the measure rule comes from DESKTOP
         typography, where you constrain a wide column down to 45-75 characters.
         A 393px phone is already at the bottom of that range. Taking another
         96px out left a 297px column — about 38 characters at 15px, BELOW the
         comfortable minimum. The rule inverted when it crossed to mobile.

         So there is no "long-form" margin. There are two: 16px for the card
         grid, because TILE_WIDTH 171 is derived from it and tested, and 24px
         for everything else. CardForm's 32, SettingsScreen's 24 and this file's
         former 48 are all drift.

         BODY TEXT IS 15px. All three shipped screens set 14px, against a system
         minimum of 15px, on the screens people actually read.

         NO REPEATED TITLE. The header carries the screen name; repeating it as
         a body heading directly beneath itself is redundant, and it reads as an
         accident rather than a decision.
         ------------------------------------------------------------------ */

      .doc-body {
        padding: 16px var(--screen-margin) 0;
        gap: 0;
        overflow: hidden;
        display: block;
      }

      /* The header carries the screen name. There is no second copy of it in
         the body — an earlier version had one and defended it as "the header is
         navigation, this is the document", which is a distinction the eye does
         not make when the two sit four pixels apart. */
      .doc-meta {
        font-family: Inter, sans-serif;
        font-size: 12px;
        line-height: 16px;
        color: var(--placeholder);
      }

      .doc-sub {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      .doc-h2 {
        font-family: Inter, sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 24px;
        color: var(--ink);
        margin-top: 32px;
        margin-bottom: 8px;
      }

      .doc-p {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--ink);
        margin-bottom: 8px;
      }

      /* Hanging indent: the wrap aligns under the text, not under the bullet. */
      .doc-li {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--ink);
        margin-bottom: 8px;
        padding-left: 32px;
        text-indent: -14px;
      }

      /* ---- search field (shared shape with the wallet) ---- */
      .doc-search {
        height: var(--touch);
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-control);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        color: var(--placeholder);
        margin-top: 24px;
      }

      .doc-search .ph {
        font-family: Inter, sans-serif;
        font-size: 17px;
        color: var(--placeholder);
      }

      /* ---- FAQ accordion ----
         These rows are TAPPABLE, so they sit on a white card with a hairline
         outline — the same treatment interactive rows get in settings. Bare
         cream is for prose; a white card is for controls. Stitch drew an
         outlined box with a CREAM fill, which is neither. */
      .faq {
        margin-top: 24px;
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-tile);
        overflow: hidden;
      }

      .faq-item + .faq-item {
        border-top: 1px solid var(--hairline);
      }

      .faq-q {
        min-height: var(--touch);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .faq-q .q {
        flex: 1 1 auto;
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 16px;
        line-height: 22px;
        color: var(--ink);
      }

      .faq-q .chev {
        color: var(--placeholder);
        display: flex;
        flex: 0 0 auto;
      }

      .faq-a {
        padding: 0 16px 16px;
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      .doc-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 32px;
      }

      .btn-outline {
        width: 100%;
        height: 52px;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: var(--radius-control);
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ---- table ----
         RULED, NOT BOXED: hairlines under the header and between rows, plus one
         closing rule under the last row so the table ends rather than trails
         off. No outer border, no card, no fills, no zebra striping, no vertical
         rule, and no colour on "Not collected" — it is neither a warning nor a
         success. */
      .tbl {
        margin-top: 32px;
      }

      .tbl-head,
      .tbl-row {
        display: flex;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--hairline);
      }

      .tbl-head span {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .tbl-row {
        min-height: var(--touch);
        align-items: flex-start;
      }

      .col-cat {
        flex: 0 0 40%;
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 15px;
        line-height: 22px;
        color: var(--ink);
      }

      .col-data {
        flex: 1 1 auto;
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      .doc-link {
        margin-top: 32px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 15px;
        line-height: 22px;
        color: var(--ink);
      }

      .doc-note {
        margin-top: 8px;
        font-family: Inter, sans-serif;
        font-size: 12px;
        line-height: 18px;
        color: var(--placeholder);
      }
    </style>
  </head>
