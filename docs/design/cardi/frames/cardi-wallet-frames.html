<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardì — wallet pattern, four state frames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ==================================================================
         SHARED FRAME LAYER — the same tokens and frame primitives as
         cardi-form-frames.html. Keep the VALUES in step; this copy is a
         superset, because the grid tokens (--grid-margin, --gutter,
         --radius-tile) and the .grid-margin variants exist only for the wallet
         and the form file predates them.

         Deliberately inlined rather than linked. These files are opened to be
         LOOKED AT, and any viewer that inlines the HTML (preview panes, the
         Artifact CSP, pasting it anywhere) silently drops a linked stylesheet
         and renders a broken frame — which reads as "the reference is wrong".
         A duplicated token block is the cheaper failure.

         This is not the source of truth for these values either way:
         cardi-design-system.md is. Both frame files are copies of it.
         ================================================================== */

      :root {
        --ink: #181824;
        --beam: #fccc0c;
        --cream: #f0f0e8;
        --white: #ffffff;
        --hairline: #d6d6cb;
        --placeholder: #55555f;
        --error: #c41e1e;

        --swatch-red: #e42424;
        --swatch-blue: #0c3c84;
        --swatch-azure: #0c84cc;
        --swatch-green: #0c843c;
        --swatch-yellow: #fccc0c;

        /* TWO margins, deliberately. 24px is the SINGLE-COLUMN margin — forms,
           settings, documents. The card grid uses 16px, and that is not a style
           choice: TILE_WIDTH 171 in features/cards/utils/gridLayout.ts is
           (390 − 2×16 − 16) / 2, frozen with tests. At 24px the tile stops being 171.
           The design system currently states one figure and needs amending. */
        --screen-margin: 24px;
        --grid-margin: 16px;
        --gutter: 16px;

        --touch: 48px;
        --radius-control: 12px;
        --radius-tile: 16px;
        --safe-top: 59px;
        --safe-bottom: 34px;
        --header-h: 56px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #c9c9c2;
        font-family: Inter, system-ui, sans-serif;
        padding: 48px 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 48px;
        justify-content: center;
        align-items: flex-start;
      }

      .plate {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .plate figcaption {
        font:
          600 12px/1.4 Inter,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #3d3d46;
      }

      /* ---- the frame: exactly 393 x 852, never anything else ---- */
      .frame {
        width: 393px;
        height: 852px;
        background: var(--cream);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* Reserved system insets — 59px top / 34px bottom, the real values for a
         393 x 852 Dynamic Island device.

         These were originally left blank. That was a mistake of presentation, not of
         measurement: on a real phone the top inset is OCCUPIED by the clock and
         indicators, so drawing it empty makes a correct 59px read as careless
         padding, and invites the exact wrong fix (shrink it — which would push
         content under the live status bar at build time).

         The status bar is SYSTEM chrome, not ours: ink only, no beam, and nothing
         here is a control. Same for the home indicator. */
      .safe-top {
        height: var(--safe-top);
        flex: 0 0 auto;
      }

      .safe-bottom {
        height: var(--safe-bottom);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .statusbar {
        height: 100%;
        padding: 14px var(--screen-margin) 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
      }

      .statusbar .clock {
        font-family: Inter, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }

      .statusbar .indicators {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .statusbar svg {
        display: block;
        fill: currentColor;
      }

      .home-indicator {
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: var(--ink);
        opacity: 0.85;
      }

      /* ---- header ----
         A three-column grid: a 48px touch target, the title, a 48px touch target.
         Icons are optically aligned, not box-aligned — a glyph drawn inside a square
         icon box carries empty side bearing, so box-aligning it to the margin leaves
         the visible stroke sitting inboard of the content beneath. The fix is to
         bleed the touch target to the frame edge and pad the content back to the
         margin: ink lands on the margin, the target stays 48px. */
      .header {
        height: var(--header-h);
        flex: 0 0 auto;
        padding: 0 var(--screen-margin);
        display: grid;
        grid-template-columns: var(--touch) 1fr var(--touch);
        align-items: center;
      }

      .header.grid-margin {
        padding: 0 var(--grid-margin);
      }

      .icon-target {
        width: var(--touch);
        height: var(--touch);
        display: flex;
        align-items: center;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--ink);
      }

      .icon-target.at-start {
        margin-left: calc(-1 * var(--screen-margin));
        padding-left: var(--screen-margin);
        justify-content: flex-start;
      }

      .icon-target.at-end {
        margin-right: calc(-1 * var(--screen-margin));
        padding-right: var(--screen-margin);
        justify-content: flex-end;
      }

      .header.grid-margin .icon-target.at-start {
        margin-left: calc(-1 * var(--grid-margin));
        padding-left: var(--grid-margin);
      }

      .header.grid-margin .icon-target.at-end {
        margin-right: calc(-1 * var(--grid-margin));
        padding-right: var(--grid-margin);
      }

      .icon-target svg {
        display: block;
      }

      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        text-align: center;
        color: var(--ink);
      }

      /* ---- body ---- */
      .body {
        flex: 1 1 auto;
        min-height: 0;
        padding: 24px var(--screen-margin) 0;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .body.grid-margin {
        padding: 8px var(--grid-margin) 0;
        gap: 16px;
      }

      /* ---- footer ----
         A flex sibling AFTER the scroll area. Never fixed, never absolute — so it
         cannot fight the keyboard. The gap above it is composition, not absence. */
      .footer {
        flex: 0 0 auto;
      }

      .hairline {
        height: 1px;
        background: var(--hairline);
        width: 100%;
      }

      .footer-inner {
        padding: var(--screen-margin);
      }

      .footer-inner.grid-margin {
        padding: var(--grid-margin);
      }

      .btn-primary {
        width: 100%;
        height: 52px;
        background: var(--ink);
        color: var(--white);
        border: 0;
        border-radius: var(--radius-control);
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ------------------------------------------------------------------
         Cardì — wallet pattern reference frames.

         Tokens, frame, insets, header shell and footer come from
         cardi-frames.css. Only wallet-specific parts live here.

         Specced from features/cards/components/CardList.tsx, CardTile.tsx and
         EmptyState.tsx — see stitch-prompts-wallet.txt for the eight findings
         that shaped these frames.

         THE RULE THIS SCREEN EXISTS TO SERVE: the grid already carries 57
         third-party brand colours that arrive with the data. Every pixel that
         is not a tile is cream, ink, white or hairline grey. Beam #FCCC0C
         appears exactly ONCE on this whole screen — the favourite star —
         because Esselunga is #FFCC00 and a yellow chrome surface beside that
         tile would make it vanish into the furniture.
         ------------------------------------------------------------------ */

      /* ---- search ---- */
      .search {
        height: var(--touch);
        flex: 0 0 auto;
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-control);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        color: var(--placeholder);
      }

      .search .text {
        flex: 1 1 auto;
        font-size: 17px;
        line-height: 24px;
      }

      .search .text.is-placeholder {
        color: var(--placeholder);
      }

      .search .text.is-value {
        color: var(--ink);
      }

      .search .clear {
        color: var(--placeholder);
        display: flex;
        align-items: center;
      }

      /* ---- sort row ----
         No borders, no pills, no filter chips: it is a count and a control,
         not a toolbar. */
      .sortrow {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sortrow .count,
      .sortrow .sort {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 13px;
        line-height: 18px;
        letter-spacing: 0.02em;
        color: var(--ink);
      }

      .sortrow .sort {
        display: flex;
        align-items: center;
        gap: 4px;
        background: none;
        border: 0;
        cursor: pointer;
      }

      /* ---- the grid ----
         Two columns at every width; the COUNT never changes, the tile WIDTH is
         derived. At this 393 frame a tile is 172.5 wide — the shipped 171 was
         measured on a 390 frame, which is the only difference. */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--gutter);
        align-content: start;
        /* Takes the remaining body height and CLIPS. Without this the grid sizes
           to its content and paints straight over the home indicator — the real
           list scrolls, so a frame that trims the last row is truthful, but one
           that spills into the system inset is just broken. */
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .tile {
        width: 100%;
        height: 140px;
        border-radius: var(--radius-tile);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        /* Flat. No shadow, no border, no gloss, no tint over the brand colour.
           The shipped CardTile has a light-mode drop shadow; it is a defect. */
      }

      /* Stand-in for the real brand SVG (features/cards/utils/brandLogos.ts).
         Rendering the name is honest for a reference frame — inventing a logo
         would not be. */
      .wordmark {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 19px;
        line-height: 24px;
        letter-spacing: 0.01em;
        text-align: center;
        padding: 0 12px;
        color: var(--white);
      }

      .wordmark.on-light {
        color: var(--ink);
      }

      /* Each mark is set in its OWN idiom — lowercase, heavy caps, light wide —
         never one house style across all eight. Setting them uniformly is the
         failure the system names outright: "do not unify the tiles, their
         clashing is the content." These are still stand-ins for the real SVGs;
         the point is that the stand-in must not flatten what production shows. */
      .wordmark.wm-lower {
        text-transform: lowercase;
        letter-spacing: -0.02em;
      }

      .wordmark.wm-caps-heavy {
        text-transform: uppercase;
        font-size: 17px;
        letter-spacing: 0.02em;
      }

      .wordmark.wm-caps-tight {
        text-transform: uppercase;
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      .wordmark.wm-caps-wide {
        text-transform: uppercase;
        font-family: Inter, sans-serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.12em;
      }

      .wordmark.wm-caps-spaced {
        text-transform: uppercase;
        font-size: 15px;
        letter-spacing: 0.06em;
      }

      .wordmark.wm-title {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.01em;
      }

      .tile-name {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 13px;
        line-height: 18px;
        letter-spacing: 0.02em;
        color: var(--ink);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Favourite badge. Shipped is an amber star on a 95%-white plate — amber
         is not in this system, and a white plate disappears on light brands.
         Ink plate + beam star is legal (icons take ink or beam, never a card
         accent) and survives all 57 catalogue colours, Esselunga included. */
      .fav-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--beam);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ---- single-card state ----
         A two-column grid holding one tile looks broken, so one card gets its
         own composition: bigger, rounder, centred. */
      .single {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 24px;
        gap: 8px;
      }

      .single .tile {
        width: 220px;
        height: 180px;
        border-radius: 20px;
      }

      .tip {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
        text-align: center;
        margin-top: 8px;
      }

      /* ---- empty state ----
         TYPE ONLY. No illustration: Wave A is illustration-free and the system
         forbids inventing a style per screen. The shipped EmptyState draws a
         wallet graphic with dots in Esselunga's #FFCC00 and Coop's #E2231A, and
         puts a coloured glow shadow under the button. All of that is gone. */
      .empty {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 8px;
      }

      .empty h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .empty p {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      /* ---- no results ----
         A search miss is not an error. No red, no icon, no "try again". */
      .noresults {
        flex: 1 1 auto;
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
        text-align: center;
        padding-top: 80px;
      }
    </style>
  </head>
  <body>
    <!-- ========================== FRAME A — POPULATED ========================== -->
    <figure class="plate">
      <div class="frame">
        <div class="safe-top">
          <div class="statusbar" aria-hidden="true">
            <span class="clock">9:41</span>
            <span class="indicators">
              <svg width="18" height="12" viewBox="0 0 18 12">
                <rect x="0" y="8.5" width="3" height="3.5" rx="1" />
                <rect x="5" y="6" width="3" height="6" rx="1" />
                <rect x="10" y="3" width="3" height="9" rx="1" />
                <rect x="15" y="0" width="3" height="12" rx="1" />
              </svg>
              <svg
                width="16"
                height="12"
                viewBox="0 0 16 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"

              >
                <path d="M1.2 4.4a10 10 0 0 1 13.6 0" />
                <path d="M4 7.3a6 6 0 0 1 8 0" />
                <circle cx="8" cy="10.4" r="1" fill="currentColor" stroke="none" />
              </svg>
              <svg width="25" height="12" viewBox="0 0 25 12">

        </div>

        <header class="header grid-margin">

              />

        </header>

        <main class="body grid-margin">
          <div class="search">

              height="20"

            <div class="card">

            <div class="card">

          </div>
        </main>

        <div class="safe-bottom"><span class="home-indicator"></span></div>
      </div>
      <figcaption>A — Populated</figcaption>
    </figure>

    <!-- ============================ FRAME B — EMPTY ============================ -->
    <figure class="plate">
      <div class="frame">
        <div class="safe-top">
          <div class="statusbar" aria-hidden="true">
            <span class="clock">9:41</span>
            <span class="indicators">
              <svg width="18" height="12" viewBox="0 0 18 12">
                <rect x="0" y="8.5" width="3" height="3.5" rx="1" />
                <rect x="5" y="6" width="3" height="6" rx="1" />
                <rect x="10" y="3" width="3" height="9" rx="1" />
                <rect x="15" y="0" width="3" height="12" rx="1" />
              </svg>
              <svg
                width="16"
                height="12"
                viewBox="0 0 16 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              >
                <path d="M1.2 4.4a10 10 0 0 1 13.6 0" />
                <path d="M4 7.3a6 6 0 0 1 8 0" />
                <circle cx="8" cy="10.4" r="1" fill="currentColor" stroke="none" />
