<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardì — settings pattern, six frames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ==================================================================
         SHARED FRAME LAYER — the same tokens and frame primitives as
         cardi-form-frames.html and cardi-wallet-frames.html. Keep the VALUES
         in step; copied rather than linked, because any viewer that inlines
         the HTML drops a linked stylesheet and renders a broken frame.
         cardi-design-system.md is the source of truth for these values.
         ================================================================== */

      :root {
        --ink: #181824;
        --beam: #fccc0c;
        --cream: #f0f0e8;
        --white: #ffffff;
        --hairline: #d6d6cb;
        --placeholder: #55555f;
        --error: #c41e1e;

        --swatch-red: #e42424;
        --swatch-blue: #0c3c84;
        --swatch-azure: #0c84cc;
        --swatch-green: #0c843c;
        --swatch-yellow: #fccc0c;

        /* TWO margins, deliberately. 24px is the SINGLE-COLUMN margin — forms,
           settings, documents. The card grid uses 16px, and that is not a style
           choice: TILE_WIDTH 171 in features/cards/utils/gridLayout.ts is
           (390 − 2×16 − 16) / 2, frozen with tests. At 24px the tile stops being 171.
           The design system currently states one figure and needs amending. */
        --screen-margin: 24px;
        --grid-margin: 16px;
        --gutter: 16px;

        --touch: 48px;
        --radius-control: 12px;
        --radius-tile: 16px;
        --safe-top: 59px;
        --safe-bottom: 34px;
        --header-h: 56px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #c9c9c2;
        font-family: Inter, system-ui, sans-serif;
        padding: 48px 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 48px;
        justify-content: center;
        align-items: flex-start;
      }

      .plate {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .plate figcaption {
        font:
          600 12px/1.4 Inter,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #3d3d46;
      }

      /* ---- the frame: exactly 393 x 852, never anything else ---- */
      .frame {
        width: 393px;
        height: 852px;
        background: var(--cream);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* Reserved system insets — 59px top / 34px bottom, the real values for a
         393 x 852 Dynamic Island device.

         These were originally left blank. That was a mistake of presentation, not of
         measurement: on a real phone the top inset is OCCUPIED by the clock and
         indicators, so drawing it empty makes a correct 59px read as careless
         padding, and invites the exact wrong fix (shrink it — which would push
         content under the live status bar at build time).

         The status bar is SYSTEM chrome, not ours: ink only, no beam, and nothing
         here is a control. Same for the home indicator. */
      .safe-top {
        height: var(--safe-top);
        flex: 0 0 auto;
      }

      .safe-bottom {
        height: var(--safe-bottom);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .statusbar {
        height: 100%;
        padding: 14px var(--screen-margin) 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
      }

      .statusbar .clock {
        font-family: Inter, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }

      .statusbar .indicators {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .statusbar svg {
        display: block;
        fill: currentColor;
      }

      .home-indicator {
        width: 140px;
        height: 5px;
        border-radius: 999px;
        background: var(--ink);
        opacity: 0.85;
      }

      /* ---- header ----
         A three-column grid: a 48px touch target, the title, a 48px touch target.
         Icons are optically aligned, not box-aligned — a glyph drawn inside a square
         icon box carries empty side bearing, so box-aligning it to the margin leaves
         the visible stroke sitting inboard of the content beneath. The fix is to
         bleed the touch target to the frame edge and pad the content back to the
         margin: ink lands on the margin, the target stays 48px. */
      .header {
        height: var(--header-h);
        flex: 0 0 auto;
        padding: 0 var(--screen-margin);
        display: grid;
        grid-template-columns: var(--touch) 1fr var(--touch);
        align-items: center;
      }

      .header.grid-margin {
        padding: 0 var(--grid-margin);
      }

      .icon-target {
        width: var(--touch);
        height: var(--touch);
        display: flex;
        align-items: center;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--ink);
      }

      .icon-target.at-start {
        margin-left: calc(-1 * var(--screen-margin));
        padding-left: var(--screen-margin);
        justify-content: flex-start;
      }

      .icon-target.at-end {
        margin-right: calc(-1 * var(--screen-margin));
        padding-right: var(--screen-margin);
        justify-content: flex-end;
      }

      .header.grid-margin .icon-target.at-start {
        margin-left: calc(-1 * var(--grid-margin));
        padding-left: var(--grid-margin);
      }

      .header.grid-margin .icon-target.at-end {
        margin-right: calc(-1 * var(--grid-margin));
        padding-right: var(--grid-margin);
      }

      .icon-target svg {
        display: block;
      }

      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: -0.01em;
        text-align: center;
        color: var(--ink);
      }

      /* ---- body ---- */
      .body {
        flex: 1 1 auto;
        min-height: 0;
        padding: 24px var(--screen-margin) 0;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }

      .body.grid-margin {
        padding: 8px var(--grid-margin) 0;
        gap: 16px;
      }

      /* ---- footer ----
         A flex sibling AFTER the scroll area. Never fixed, never absolute — so it
         cannot fight the keyboard. The gap above it is composition, not absence. */
      .footer {
        flex: 0 0 auto;
      }

      .hairline {
        height: 1px;
        background: var(--hairline);
        width: 100%;
      }

      .footer-inner {
        padding: var(--screen-margin);
      }

      .footer-inner.grid-margin {
        padding: var(--grid-margin);
      }

      .btn-primary {
        width: 100%;
        height: 52px;
        background: var(--ink);
        color: var(--white);
        border: 0;
        border-radius: var(--radius-control);
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ------------------------------------------------------------------
         Cardì — settings pattern reference frames.

         Specced from features/settings/screens/SettingsScreen.tsx and the
         eight *Sheet.tsx components — see stitch-prompts-settings.txt.

         The eight sheets reduce to FOUR shapes: pick-one-from-a-list,
         confirm, acknowledge, type-to-confirm. Frames C-F draw one each;
         every other sheet in the app is one of them with different words.

         Note the margin: 24px, which is what the code already uses. The design
         system said 20px until 2026-08-21, when the 8px grid settled it against
         itself: 20 is 2.5 x 8 and off-grid, 24 is 3 x 8. Settings was never
         drifting — it was following the token, and the token was right.
         The card grid uses 16 because 171 is derived from it and tested;
         settings' 24 has no derivation behind it, so it follows the system.
         ------------------------------------------------------------------ */

      .settings-body {
        padding: 16px var(--screen-margin) 0;
        gap: 24px;
        overflow: hidden;
      }

      /* ---- section ---- */
      .sec {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 0 0 auto;
      }

      .sec-title {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--placeholder);
      }

      /* ---- card: white on cream, hairline outline, rows divided by rules.
         Flat — the outline is the hierarchy, never a shadow. ---- */
      .card {
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-tile);
        overflow: hidden;
      }

      .row {
        min-height: var(--touch);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .row + .row,
      .acct-head + .row {
        border-top: 1px solid var(--hairline);
      }

      .row .label {
        font-family: Inter, sans-serif;
        font-size: 17px;
        line-height: 24px;
        color: var(--ink);
        flex: 1 1 auto;
      }

      .row .value {
        font-family: Inter, sans-serif;
        font-size: 17px;
        line-height: 24px;
        color: var(--placeholder);
        max-width: 46%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row .chev {
        color: var(--placeholder);
        display: flex;
        flex: 0 0 auto;
      }

      .row .ico {
        color: var(--ink);
        display: flex;
        flex: 0 0 auto;
      }

      /* Destructive rows are TEXT, never a red fill or a red border. The
         system specifies borderless #C41E1E; Button.tsx currently renders a
         filled error-red slab, which is the divergence these frames reject. */
      .row.is-destructive .label {
        color: var(--error);
      }

      /* A row that shows a value but does nothing must not look tappable:
         no chevron. App version and catalogue are information. */

      .acct-head {
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .acct-head .cap {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--placeholder);
      }

      .acct-head .email {
        font-family: Inter, sans-serif;
        font-size: 17px;
        line-height: 24px;
        color: var(--ink);
      }

      /* ---- guest block ---- */
      .guest {
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }

      .guest h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 20px;
        line-height: 28px;
        color: var(--ink);
      }

      .guest p {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      .guest .actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
      }

      /* ---- buttons ---- */
      .btn-outline {
        width: 100%;
        height: 52px;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: var(--radius-control);
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Borderless, no fill, no outline. A destructive action should read as
         a decision, not as a red slab competing with the safe option. */
      .btn-destructive {
        width: 100%;
        height: 52px;
        background: transparent;
        color: var(--error);
        border: 0;
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* The ONE place this system draws a control disabled, because the gate
         is the entire point of the screen. */
      .btn-destructive.is-disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* ---- sheet ---- */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(24, 24, 36, 0.4);
      }

      /* The status bar is the SYSTEM layer and stays legible above the scrim.
         iOS dims the app's content when a sheet opens; it does not dim the
         clock. Scrimming it would be a rendering of the mock, not of the OS. */
      .safe-top {
        position: relative;
        z-index: 2;
      }

      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--white);
        border-radius: var(--radius-tile) var(--radius-tile) 0 0;
        display: flex;
        flex-direction: column;
      }

      .grabber {
        width: 36px;
        height: 4px;
        border-radius: 999px;
        background: var(--hairline);
        margin: 8px auto 0;
        flex: 0 0 auto;
      }

      .sheet-inner {
        padding: 16px var(--screen-margin) 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sheet-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 20px;
        line-height: 28px;
        color: var(--ink);
      }

      .sheet-body {
        font-family: Inter, sans-serif;
        font-size: 15px;
        line-height: 22px;
        color: var(--placeholder);
      }

      .sheet-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 16px;
      }

      /* Option list: choosing IS the action, so there are no buttons. */
      .opts {
        margin: 8px calc(-1 * var(--screen-margin)) 0;
      }

      .opt {
        min-height: var(--touch);
        padding: 12px var(--screen-margin);
        display: flex;
        align-items: center;
        border-top: 1px solid var(--hairline);
      }

      .opt .label {
        flex: 1 1 auto;
        font-family: Inter, sans-serif;
        font-size: 17px;
        line-height: 24px;
        color: var(--ink);
      }

      .opt .check {
        color: var(--ink);
        display: flex;
      }

      .helper {
        font-family: Inter, sans-serif;
        font-size: 13px;
        line-height: 18px;
        color: var(--placeholder);
        padding-top: 12px;
      }

      .field-label {
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink);
        margin-top: 16px;
      }

      .field {
        min-height: var(--touch);
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-control);
        margin-top: 8px;
      }

      .sheet-safe {
        height: var(--safe-bottom);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
      }
    </style>
  </head>
