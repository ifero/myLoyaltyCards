# Team override for the bmad-sprint-planning skill (BMAD 6.12).
# Merges over .claude/skills/bmad-sprint-planning/customize.toml per BMad structural
# rules (scalars: override wins; arrays such as persistent_facts / activation_steps_*: append).
#
# WHY THIS EXISTS
# ---------------
# This project's docs/sprint-artifacts/sprint-status.yaml is a documented SUPERSET of the vanilla
# BMAD schema (see docs/sprint-artifacts/README.md): sprint blocks, extension statuses, and story
# slugs that are chosen by hand.
#
# In 6.12 the skill's `generate` intent is a deterministic script (scripts/sprint_plan.py) that
# derives every key from the `### Story N.M: Title` headings in docs/epics.md. Against this tracker
# that derivation does not line up. A dry run at install time reported `in_sync: false`, 109 new
# entries and 111 "dropped orphans": tracker entries whose hand-picked slug differs from the derived
# one (`1-1-configure-development-environment` against a derived `...-enabling`). By status the
# orphans were 84 done, 22 backlog, 2 drafted, 1 absorbed-into-epic-18 and two LIVE stories, one
# ready-for-dev and one in-progress. A real run would drop all of them, add 109 fresh `backlog` keys
# in their place, and rebuild `development_status` without its inline comments (the epic completion
# dates and story notes). Without `--fresh` the script keeps the sprint blocks and action_items;
# with `--fresh` it starts from an empty document and the sprint blocks are lost.
#
# So the guard is a prohibition, not a merge hint. The 6.10 version of this file asked a prose
# workflow to merge carefully; the generate step is now a script, and there is no prose left to steer.
#
# `status` and `validate` are read-only and safe. On this tracker `validate` reports 12 problems: nine
# terminal statuses (`cancelled`, `absorbed*`), two keys that predate the numeric convention and one
# `parked` action item. All of them are documented in docs/sprint-artifacts/README.md, so that is
# expected.

[workflow]

# Runs before the workflow proceeds, so the prohibition is in force before any intent is chosen.
activation_steps_prepend = [
  "GENERATE IS OFF-LIMITS (this project). Do not run `sprint_plan.py generate`, with or without `--fresh` or `--set`, against docs/sprint-artifacts/sprint-status.yaml, and do not rebuild the file by hand or through the fix flow. The tracker's story slugs are hand-chosen and do not match the slugs the script derives from docs/epics.md, so generation drops about 110 entries as orphans (84 of them done, plus a live in-progress story and a live ready-for-dev one), adds fresh backlog duplicates in their place, and strips every inline comment. Allowed: the readiness gate (report only), the `status` view, `validate` (its 12 `problems` are this project's documented terminal statuses, two odd keys and a parked action item, which is expected), and hand edits that follow docs/sprint-artifacts/README.md. If the user asks to run sprint planning or to fix the file, run the allowed parts, explain why generate was skipped, and stop.",
]

persistent_facts = [
  "file:{project-root}/docs/sprint-artifacts/README.md",
  "sprint-status.yaml is a documented SUPERSET (sprint blocks, extension statuses, hand-chosen slugs). Sprints advance by editing the sprint blocks by hand and story keys are added by hand; nothing regenerates the file. See docs/sprint-artifacts/README.md.",
]

# Backstop, executed at the final step.
on_complete = """
Check that this run did not change the tracker: `git diff --stat -- docs/sprint-artifacts/sprint-status.yaml`.
If the file changed and the user did not ask for a specific hand edit, STOP and show the user the diff.
Do not restore or rewrite anything without asking: uncommitted tracker edits are normal mid-story, and
a blind `git checkout` would destroy them.
"""
