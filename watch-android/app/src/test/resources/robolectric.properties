# Pin the Robolectric Android runtime to API 35 for every Robolectric test in this module.
#
# 35 is the module's targetSdk (Wear OS / Android Automotive are carved out of Play's API-36 rule
# at 35 — see app/build.gradle.kts). Robolectric 4.16.1 supports 36, but running against the
# targetSdk is the deterministic, self-consistent choice and avoids re-pinning each time compileSdk
# moves. Room's SQLite behaviour does not vary across these levels.
sdk=35
