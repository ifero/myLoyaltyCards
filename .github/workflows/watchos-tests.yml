name: CI — watchOS tests

on:
  # Lets a maintainer re-measure the job duration on demand when re-tuning
  # timeout-minutes, without pushing a throwaway commit to a trigger path.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'targets/watch/**'
      - 'watch-ios/**'
      - 'ios/**'
      - 'app.json'
      - 'fastlane/Fastfile'
      - '.github/workflows/watchos-tests.yml'
  push:
    branches: [main]
    paths:
      - 'targets/watch/**'
      - 'watch-ios/**'
      - 'ios/**'
      - 'app.json'
      - 'fastlane/Fastfile'
      - '.github/workflows/watchos-tests.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# One run per ref, newest wins. `github.ref` is `refs/heads/main` for merges and
# `refs/pull/N/merge` for PRs, so a PR can only ever cancel its own earlier run.
# This job holds a macOS runner for ~20 minutes, so superseded runs are the
# single most expensive thing in the pipeline: merging three PRs back-to-back
# used to leave three builds racing when only the tip commit's result matters.
# Cancelling is safe here — the job builds and asserts, it publishes nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchos-tests:
    name: watchOS (xcodebuild) tests
    runs-on: macos-latest
    # The scheme's dependency graph is now narrowed, so the ceiling that used to
    # need 50m does not any more. `watch:build:ci` builds the watch targets via
    # `-project … -target watch` instead of `-workspace … -scheme watch`.
    # Measured on the first green run after that change (30637151382), not
    # estimated: the xcodebuild step went 18m47s → 45s, the whole job 21m55s →
    # 4m53s. 20m leaves ~4x headroom while still catching a genuine hang.
    #
    # Budget against `expo prebuild --clean`, not the build. Prebuild is now the
    # dominant step at 2m34s — 53% of the job — and by far the most variable:
    # the identical step took 1m08s on the run before this change. The build no
    # longer moves the total; prebuild and the runner draw do.
    #
    # Why -target and not -scheme: no shared `watch` scheme exists (only
    # myLoyaltyCards.xcscheme is shared), so xcodebuild autocreates one — and
    # autocreation adds the container app. That dragged in the whole iOS Pod
    # tree (Sentry, ZXingObjC, libwebp, SDWebImage, RNSVG, RNReanimated, …) for
    # ~17m of every run. The real target graph runs the other way round
    # (myLoyaltyCards → watch → watchwidget) and the watch targets declare no
    # pods of their own, so none of it was ever an input to this check.
    #
    # -sdk watchsimulator is load-bearing: in -target mode xcodebuild otherwise
    # defaults to the iOS SDK and fails the watch targets on provisioning.
    # (Not to be confused with -sdk iphonesimulator on the *app* build, which
    # breaks the watch widget.) If a targets/*/pods.rb ever appears, these
    # targets gain CocoaPods deps and this must go back through the workspace.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode (latest stable for iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          # See ci-quality-gates.yml — bump the sdk55 salt when the dep tree
          # changes shape so a stale node_modules from a prior SDK is not
          # restored via restore-keys.
          key: ${{ runner.os }}-yarn-sdk55-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-sdk55-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run watchOS catalogue generation tests (Jest)
        run: npx jest --testPathPattern='targets/watch/__tests__' --testPathIgnorePatterns='/node_modules/' --no-coverage
        env:
          CI: true

      - name: Generate iOS project with watch target
        run: npx expo prebuild --clean --platform ios

      - name: Generate watchOS catalogue (Brands.swift)
        run: xcrun --sdk macosx swift watch-ios/Scripts/generate-catalogue.swift

      - name: Check generated watchOS catalogue
        run: yarn check:catalogue-generated
        env:
          CI: true

      - name: Build watchOS target (xcodebuild)
        run: yarn watch:build:ci
        env:
          CI: true
