name: CI — watchOS tests

on:
  # Lets a maintainer re-measure the job duration on demand when re-tuning
  # timeout-minutes, without pushing a throwaway commit to a trigger path.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'targets/watch/**'
      - 'watch-ios/**'
      - 'ios/**'
      - 'app.json'
      - 'fastlane/Fastfile'
      - '.github/workflows/watchos-tests.yml'
  push:
    branches: [main]
    paths:
      - 'targets/watch/**'
      - 'watch-ios/**'
      - 'ios/**'
      - 'app.json'
      - 'fastlane/Fastfile'
      - '.github/workflows/watchos-tests.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  watchos-tests:
    name: watchOS (xcodebuild) tests
    runs-on: macos-latest
    # Job wall-clock for green runs, measured over the last 30 successful runs
    # (includes the ~2m of cache-save post-steps, which count against this
    # ceiling): median ~23m, p95 ~28m, slowest ~29m. The old 30m limit sat
    # inside that noise band, so a slow runner draw surfaced as a red
    # `cancelled` check with zero failing steps rather than as a real failure.
    #
    # Nearly all of it is the xcodebuild step: the `watch` scheme depends on the
    # parent iOS app, so ~23m goes to compiling that app's Pod tree (RNSVG,
    # RNReanimated, RNScreens, SDWebImage, …) to reach a watch target that
    # itself compiles in ~17s. Caching does not reach that cost — see the PR
    # that raised this limit — so headroom is the fix until the scheme's
    # dependency graph is narrowed.
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode (latest stable for iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          # See ci-quality-gates.yml — bump the sdk55 salt when the dep tree
          # changes shape so a stale node_modules from a prior SDK is not
          # restored via restore-keys.
          key: ${{ runner.os }}-yarn-sdk55-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-sdk55-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run watchOS catalogue generation tests (Jest)
        run: npx jest --testPathPattern='targets/watch/__tests__' --testPathIgnorePatterns='/node_modules/' --no-coverage
        env:
          CI: true

      - name: Generate iOS project with watch target
        run: npx expo prebuild --clean --platform ios

      - name: Generate watchOS catalogue (Brands.swift)
        run: xcrun --sdk macosx swift watch-ios/Scripts/generate-catalogue.swift

      - name: Check generated watchOS catalogue
        run: yarn check:catalogue-generated
        env:
          CI: true

      - name: Build watchOS target (xcodebuild)
        run: yarn watch:build:ci
        env:
          CI: true
