name: CI — Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# One run per ref — but only PRs cancel. A superseded PR run is pure waste, while
# on main every commit keeps its own gate result: this is the job that tells you
# *which* merge broke the branch, and collapsing three merges into one run throws
# that away. It is a short ubuntu job, so letting main runs finish costs little.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    name: Quality gates (lint, typecheck, test, coverage)
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          # Bump the salt (sdk55) when the dependency tree changes shape so
          # we don't restore a partial cache from a previous SDK with stale
          # hoisting (e.g. strip-ansi alias mismatch).
          key: ${{ runner.os }}-yarn-sdk55-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-sdk55-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `patch-package` rewrites files inside node_modules, which is uncommitted,
      # rebuilt on every install and RESTORED FROM THE CACHE ABOVE. A patch can
      # therefore vanish in total silence — patches/ deleted, patch-package
      # dropped from postinstall, the patched package bumped, or a cache built
      # before the patch existed — and the app just reverts to upstream behaviour
      # with every gate still green. This asserts the patched CODE is present, not
      # merely that the patch file is, so none of those routes goes unnoticed.
      - name: Verify native patches are applied
        run: yarn check:native-patches

      # `classifyMountError` matches on `expo-camera`'s mount-error message text,
      # because `CameraMountError` carries no error code. That degrades in silence:
      # an upstream reword reclassifies every event to `other` with no test failing
      # and no build breaking, visible only as a drifting tag distribution weeks
      # later. This asserts at build time what that classifier assumes at runtime.
      - name: Verify upstream native strings still exist
        run: yarn check:native-strings

      - name: Lint
        run: yarn lint

      # `lint-staged` only formats *staged* files, so anything landing via a bot
      # or agent commit, or a `git commit -n` bypass, could stay prettier-dirty
      # indefinitely. This is the backstop. Exclusions live in `.prettierignore`
      # (which prettier honours even for explicitly-named files, so it governs
      # lint-staged too) — notably the watch AppIcon Contents.json, whose bytes
      # must keep matching what `expo prebuild` writes.
      # Fix locally with `yarn format`; check the same thing with `yarn format:check`.
      - name: Format
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Check design tokens are in sync
        run: yarn tokens:check

      # Regenerates assets/splash-icon.png from app-icon-variant-aurora-transparent.svg
      # and fails on any mismatch, so the checked-in raster can never drift from the
      # artwork. Also catches the trap that shipped a hard-edged blue square on the
      # launch field: `assets/icon.png` is intentionally opaque and full-bleed (the OS
      # masks app icons itself), so it must never be used as the splash image.
      - name: Check the splash icon is in sync with its source artwork
        run: yarn splash:check

      - name: Check tests are co-located (no __tests__ folders)
        run: yarn check:no-tests-folders

      # docs/sprint-artifacts/README.md states that every `### Story N.M` in
      # docs/epics.md maps 1:1 to a `development_status` key in sprint-status.yaml.
      # Nothing enforced it, and it broke twice in a row: a drafting PR added the
      # tracker key and the story file but not the catalogue section (Story 16.24,
      # fixed by PR #190; Story 16.25, fixed by PR #198). Both gaps were found by
      # hand. The failure is quiet and downstream — `create-story` happily reads a
      # tracker key with no content behind it and drafts against a story whose
      # goal and acceptance criteria exist nowhere. This also pins the
      # `totalStories` frontmatter field to the literal `### Story ` heading count,
      # the rule epics.md records inline, after three different counting rules let
      # the number drift.
      - name: Check the story catalogue matches the sprint tracker
        run: yarn check:story-catalogue-sync

      - name: Run tests (with coverage)
        run: yarn test:coverage --watchAll=false --runInBand

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Slack notification on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,commit,author,job
