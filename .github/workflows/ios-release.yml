# iOS AdHoc Build
# Triggers on main branch push when something that can change the shipped binary
# changes — see the annotated path list below.
# Also available as manual workflow_dispatch on any branch.
name: iOS AdHoc Build

on:
  push:
    branches: [main]
    paths:
      # Source that reaches the JS bundle.
      - 'app/**'
      - 'core/**'
      - 'features/**'
      - 'shared/**'
      # Local Expo modules. `modules/wear-data-layer` is Android-only NATIVELY, but
      # `core/wear-connectivity.ts` does `require('@/modules/wear-data-layer')`, so its
      # TypeScript is bundled for iOS too. Absent until Story 16.36 — a change to it
      # built nothing on either platform.
      - 'modules/**'
      # Native projects, plus the watch companion embedded in the iOS binary.
      - 'ios/**'
      - 'targets/**'
      - 'watch-ios/**'
      # Data and assets compiled into the binary. catalogue/italy.json is read by
      # watch-ios/Scripts/generate-catalogue.swift during this very build, so a
      # brand added to the catalogue alone still changes what ships.
      - 'catalogue/**'
      - 'assets/**'
      - 'tokens/**'
      # Build inputs: Expo config (incl. the app version), dependencies, the
      # native patches this workflow verifies below, and the Fastlane lanes.
      - 'app.json'
      - 'app.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'patches/**'
      - 'fastlane/**'
      # So a change to this pipeline is exercised on merge (as watchos-tests.yml does).
      - '.github/workflows/ios-release.yml'
      # …but never for files that cannot reach the binary: tests are co-located
      # beside their subject and stories are Storybook-only (Chromatic covers
      # those, and there is no web target). Order is load-bearing — a negative
      # pattern after a positive match excludes that path, while a commit that
      # ALSO touches real source still matches and still builds.
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '!**/*.stories.tsx'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# One run per ref, newest wins — see watchos-tests.yml for the key rationale.
# Cancelling an AdHoc build loses nothing durable: the lane derives its build
# number from GITHUB_RUN_NUMBER without committing it, `match` runs readonly on
# CI so no signing assets are minted, and the only output is a run artifact.
# When several PRs merge in a row, the IPA worth keeping is the tip commit's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-adhoc:
    name: iOS AdHoc Build
    runs-on: macos-latest
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      # Sentry: DSN is inlined into the JS bundle at build time (runtime reporting);
      # auth token lets the build phases upload source maps + dSYMs for symbolication.
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_DISABLE_COLORS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode (latest stable for iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Install dependencies
        # `yarn install` runs the `supabase` CLI postinstall, which downloads a
        # binary from GitHub Releases and pipes it into gunzip without checking the
        # HTTP status. A transient GitHub hiccup therefore aborts the whole install
        # with `Z_DATA_ERROR: incorrect header check`. This CLI version has no
        # skip-download flag, so retry to ride out the flakiness.
        run: |
          for attempt in 1 2 3; do
            if yarn install --frozen-lockfile; then
              echo "Dependencies installed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::yarn install failed (attempt $attempt/3); retrying in 15s…"
            sleep 15
          done
          echo "::error::yarn install failed after 3 attempts."
          exit 1
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}" >> .env
          echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" >> .env
      - name: Configure Sentry symbol upload
        # The Sentry Expo plugin adds build phases that upload source maps + dSYMs
        # via sentry-cli, which requires SENTRY_AUTH_TOKEN. Without it the phases
        # fail the build, so skip upload cleanly when the token is absent
        # (SENTRY_DISABLE_AUTO_UPLOAD is honoured by the iOS scripts and Android
        # sentry.gradle alike) and enable it when present.
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN present — Sentry symbol/source-map upload enabled."
            echo "SENTRY_DISABLE_AUTO_UPLOAD=false" >> "$GITHUB_ENV"
          else
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry symbol upload (crashes won't be symbolicated). Add the SENTRY_AUTH_TOKEN repo secret to enable."
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          fi
      # A `patch-package` patch lives in the uncommitted `node_modules`, so a build
      # can silently ship WITHOUT it: `patch-package --error-on-fail` only fails on a
      # CONFLICT, and a patch file that is simply absent (bad merge, or a
      # workflow_dispatch on a branch that never ran the PR gates) makes it a
      # successful no-op. That would ship an iOS binary missing the barcode resample
      # retry with nothing red anywhere (Story 16.23 AC7). Verified here, in the
      # pipelines that actually produce a binary, not only at PR time.
      - name: Verify native patches are applied
        run: yarn check:native-patches
      - name: Prebuild native projects
        run: npx expo prebuild --platform ios
      - name: Generate watchOS catalogue (brands + brand-logo assets)
        run: xcrun --sdk macosx swift watch-ios/Scripts/generate-catalogue.swift
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
      - name: Run Fastlane (iOS AdHoc)
        run: bundle exec fastlane ios adhoc
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: myLoyaltyCards-adhoc-${{ github.run_id }}
          path: output/*.ipa
          if-no-files-found: error
