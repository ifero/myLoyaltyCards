name: CI — Wear OS build

# Compiles the standalone Wear OS Gradle project (Story 10.1, Open Decision 5).
#
# Path-filtered to `watch-android/**` so it stays OFF the phone app's critical
# path — the same shape as chromatic.yml's filtering and watchos-tests.yml's
# scoping. `ci-quality-gates.yml` never compiles Kotlin: `yarn lint` is
# `eslint . --ext .ts,.tsx` and jest matches only `**/*.test.[jt]s?(x)`, so `.kt`
# is invisible to both.
#
# What this proves, precisely: both variants COMPILE — including `release`, which R8
# and resource shrinking actually process (added by Story 16.35, which made the
# release variant the one users receive) — and the JVM unit tests pass (Story 10.3
# added the first ones — sort comparators, colour maths, the read-only invariant and
# the sort-preference round-trip). Since Story 16.43 it also runs a standalone
# `lintDebug`, where exactly ONE issue — `MonochromeLauncherIcon`, promoted to fatal in
# app/lint.xml — can fail the job; everything else lint reports is a warning and cannot.
# It still runs nothing on a
# device; the install-and-launch and round/square layout checks are done by hand on
# Wear OS emulators. The release bundle produced here is UNSIGNED and is not uploaded
# anywhere — the release pipelines build their own and inject the keystore. See
# watch-android/README.md § CI before assuming more.
#
# The reason it exists at all: the phone app's Android surface already has
# effectively no telemetry, and an uncompiled module rots silently. If Gradle
# ever gets slow enough to hurt, downgrade this to a nightly and say so in the
# README — do not leave Epic 10's foundation with nothing compiling it.

on:
  # Lets a maintainer re-measure the job duration on demand when re-tuning
  # timeout-minutes, without pushing a throwaway commit to a trigger path.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'watch-android/**'
      - '.github/workflows/wear-os-build.yml'
  push:
    branches: [main]
    paths:
      - 'watch-android/**'
      - '.github/workflows/wear-os-build.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Mirrors ci-quality-gates.yml rather than watchos-tests.yml: only PR runs
# cancel. A superseded PR run is pure waste, but on main every commit keeps its
# own result, which is what tells you *which* merge broke the build. This is a
# short ubuntu job, so letting main runs finish costs little.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wear-os-build:
    name: Wear OS (Gradle) build
    runs-on: ubuntu-latest
    # Measured at ~1m30s locally from a cold Gradle cache, WITH the release variant
    # (R8 + resource shrinking) included — roughly ten seconds more than the
    # debug-only job it replaced. 20m is deliberate headroom for a cold CI cache
    # plus SDK downloads on the first run, and still short enough to catch a
    # genuine hang. Re-measure with workflow_dispatch before tightening it.
    #
    # Story 16.43 added `lintDebug` and re-measured: +14s locally (71s -> 85s, both
    # with `--rerun-tasks`, which is a different method from the cold-cache figure
    # above and not directly comparable to it). The real job ran 2m58s on PR #244
    # before lint, so expect a little over three minutes. Nowhere near the 20m
    # ceiling, so the timeout is unchanged.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.3 requires JDK 17 as a minimum, and the build compiles to Java 17
      # bytecode. Pin it rather than inheriting whatever the runner image ships.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image's preinstalled platforms drift over time; install the
      # two SDK components this build actually needs so a runner-image bump
      # cannot silently break the job. Both are no-ops when already present.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # Also validates every Gradle wrapper JAR in the repo against Gradle's
      # published checksums (validate-wrappers defaults to true) — a real
      # supply-chain check, since the wrapper JAR is a tracked binary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `bundleRelease` is here because Story 16.35 made the release variant the one users
      # receive — and an AAB specifically, because Play refuses raw APKs for this
      # application. Building the artifact that actually ships is the point; it runs R8
      # exactly as `assembleRelease` would.
      #
      # Until Story 16.35, R8 full mode had NEVER run against this app.
      # `app/proguard-rules.pro` says so in its own header: its ZXing keep rules were
      # written blind, against a variant CI did not build. A mis-optimised barcode path
      # would otherwise surface only on a real watch, and there is no Android telemetry to
      # notice with — so this is the cheap half of that guarantee.
      #
      # The bundle produced here is UNSIGNED and is uploaded nowhere; the release pipelines
      # build their own and inject the keystore. Note an unsigned bundle carries the SAME
      # filename as a signed one, so nothing in this job can or should assert on signing.
      # `lintDebug` is here because Story 16.43 found that Android lint ran in CI only
      # by accident: `lintVitalRelease` is in `bundleRelease`'s task graph, so FATAL-severity
      # issues were already caught, and nothing below fatal was. `MonochromeLauncherIcon` —
      # which `app/lint.xml` leaves unsuppressed ON PURPOSE so the themed-icon gap stays
      # visible — sits below fatal, so Story 21.4 satisfied it once, locally, and nothing
      # would have noticed it regressing.
      #
      # ⚠️ AND THE PROMOTION IS `fatal`, NOT `error`, which is what makes it reach the
      # RELEASE pipelines too. `fastlane`'s `build_wear_bundle!` calls `bundleRelease`
      # directly and runs no lint task, so an `error` would have gated only this job.
      # `fatal` is additionally enforced by `lintVitalRelease`, which AGP already wires
      # into `bundleRelease` — same single named issue, strictly wider coverage.
      #
      # ⚠️ ADDING THE TASK IS NOT WHAT MAKES IT A GATE. This module configures no `lint {}`
      # block, so defaults apply: `abortOnError` fails on ERRORS, and lint's default
      # severity for these checks is WARNING. `lintDebug` exits 0 with warnings present.
      # What gates is `app/lint.xml` promoting that one issue to `severity="fatal"`;
      # measured, removing the <monochrome> layer takes this job from exit 0 to exit 1.
      #
      # ⛔ The three surviving warnings are deliberately NOT suppressed, and
      # `AndroidGradlePluginVersion` in particular consults the NETWORK for the newest
      # published version. That is harmless while the promotion is targeted — a warning
      # cannot fail this job — and would become a red build on a day nobody touched the
      # repository the moment anyone reaches for `warningsAsErrors`. `app/lint.xml` says so
      # next to the check itself.
      #
      # `lintDebug` rather than `lint`, and NOT because `lint` aggregates variants — AGP 7.0
      # stopped that and this module pins 9.3.1, so plain `lint` maps to the default variant
      # anyway. The reason that actually holds: these checks read resources and the manifest,
      # which do not differ by variant, so pinning lint to the SAME variant the rest of this
      # step already builds keeps one story rather than two. Measured at ~15s warm.
      #
      # ⚠️ Listing `lintDebug` first does NOT guarantee it runs first. Gradle's own docs are
      # explicit that "a task having no dependencies may execute earlier than it is listed on
      # the command-line", and these four tasks are siblings with no dependency edges between
      # them. The job still fails if lint fails, wherever it lands in the schedule — but do
      # not read the ordering as a promise that lint short-circuits the build.
      - name: Lint, run unit tests and build Wear OS debug APK + release bundle
        working-directory: watch-android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug bundleRelease --no-daemon
