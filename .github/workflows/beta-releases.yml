name: Beta Releases (RC)

on:
  # A published release is the reliable trigger. GitHub honours `[skip ci]` and
  # friends ONLY for the push and pull_request events, and mark-story-done.yml
  # lands `chore(sprint): mark story done after merge [skip ci]` on main after
  # most merges — so tagging that tip and pushing the tag creates no run at all.
  # Publishing the release cannot be skipped, whatever the tagged commit says.
  release:
    types: [published]
  # Kept so a habitual `git push --tags` is never a silent no-op. When both
  # events fire for one tag the concurrency group below collapses them to one run.
  push:
    tags:
      - 'v*.*.*-rc.*' # RC tags for beta builds
  # Manual re-run, e.g. after a flaky upload. Not skippable either.
  workflow_dispatch:
    inputs:
      tag:
        description: 'RC tag to build (e.g. v1.0.0-rc.18)'
        required: true

# github.ref_name is the bare tag name for BOTH the release and the tag-push
# event, so a tag that fires both collapses to a single run. The loser is
# cancelled seconds after queuing — during runner setup, ~20 minutes before any
# upload — so no partial build ever reaches TestFlight or Play.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ios-testflight-beta:
    name: Build iOS TestFlight (RC)
    runs-on: macos-latest
    # `on.release` cannot filter by tag pattern, so the RC selection that used to
    # live entirely in `on.push.tags` is enforced here for release events. Push
    # runs are already scoped by the tag pattern; dispatch is deliberate.
    if: github.event_name != 'release' || contains(github.event.release.tag_name, '-rc.')
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      # Sentry: DSN inlined into the bundle at build time; auth token enables
      # source-map + native-symbol upload for symbolication.
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_DISABLE_COLORS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release → refs/tags/<tag> (GITHUB_SHA is already the tagged commit);
          # push → the tag; workflow_dispatch → the tag typed by the operator.
          # `github.event.inputs` is null for the first two, so `||` falls through.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Select Xcode (latest stable for iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}" >> .env
          echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" >> .env
      - name: Configure Sentry symbol upload
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN present — Sentry symbol/source-map upload enabled."
            echo "SENTRY_DISABLE_AUTO_UPLOAD=false" >> "$GITHUB_ENV"
          else
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry symbol upload (crashes won't be symbolicated). Add the SENTRY_AUTH_TOKEN repo secret to enable."
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          fi
      # A `patch-package` patch lives in the uncommitted `node_modules`, so a build
      # can silently ship WITHOUT it: `patch-package --error-on-fail` only fails on a
      # CONFLICT, and a patch file that is simply absent (bad merge, or a
      # workflow_dispatch on a branch that never ran the PR gates) makes it a
      # successful no-op. That would ship an iOS binary missing the barcode resample
      # retry with nothing red anywhere (Story 16.23 AC7). Verified here, in the
      # pipelines that actually produce a binary, not only at PR time.
      - name: Verify native patches are applied
        run: yarn check:native-patches
      - name: Prebuild native projects
        run: npx expo prebuild --platform ios
      - name: Generate watchOS catalogue (brands + brand-logo assets)
        run: xcrun --sdk macosx swift watch-ios/Scripts/generate-catalogue.swift
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
      - name: Build iOS TestFlight (RC)
        run: bundle exec fastlane ios beta

  # Builds and uploads BOTH Android artifacts of one release: the phone AAB to the mobile
  # track, and the Wear OS companion AAB to Play's dedicated `wear:` form-factor track
  # (Story 16.35). One job, not two: the artifacts are two halves of one release intent, and a
  # partial ship should be one red X rather than two independently-green jobs. See the
  # Fastfile's `upload_wear_bundle!` for why the Wear half cannot go on the phone's track,
  # and `wear_play_track` for why its track name is not derived from the phone's.
  android-beta:
    name: Build Android Alpha + Wear OS (RC)
    runs-on: ubuntu-latest
    # See ios-testflight-beta above for why this guard exists.
    if: github.event_name != 'release' || contains(github.event.release.tag_name, '-rc.')
    env:
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      PLAY_STORE_API_KEY: ${{ secrets.PLAY_STORE_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      # Sentry: DSN inlined into the bundle at build time; auth token enables
      # source-map + native-symbol upload for symbolication.
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_DISABLE_COLORS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See ios-testflight-beta above.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
      # Pinned rather than inherited from the runner image, which drifts. AGP 9.3
      # requires JDK 17 as a minimum for the Wear OS project this job now also
      # builds, and wear-os-build.yml already pins the same version — keep them equal.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # `watch-android` compiles against API 36, and `apksigner` (used by the
      # signing-parity check below) ships in build-tools, which is not otherwise on
      # PATH. Both are no-ops when the runner image already provides them.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}" >> .env
          echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" >> .env
      - name: Configure Sentry symbol upload
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN present — Sentry symbol/source-map upload enabled."
            echo "SENTRY_DISABLE_AUTO_UPLOAD=false" >> "$GITHUB_ENV"
          else
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry symbol upload (crashes won't be symbolicated). Add the SENTRY_AUTH_TOKEN repo secret to enable."
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          fi
      - name: Compute Android versionCodes (phone + Wear)
        # Authoritative versionCode baked into the AAB manifest by app.config.ts
        # during prebuild. Alpha/beta band = the workflow run number.
        #
        # WEAR_VERSION_CODE is the SAME counter, deliberately: the Wear build adds its
        # own band (2,000,000 for beta) in watch-android/app/build.gradle.kts, so this
        # workflow carries no band arithmetic to keep in sync — unlike the phone's
        # production offset. The band is selected from the upload track by the
        # Fastfile's build_wear_apk!, so it cannot disagree with the destination.
        #
        run: |
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "WEAR_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Prebuild native projects
        run: npx expo prebuild --platform android
      - name: Decode Android release keystore
        run: |
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
      # NOTE: this is $GRADLE_USER_HOME/gradle.properties, which OVERRIDES a project's own
      # gradle.properties — the user-home file is consulted first and `org.gradle.jvmargs` is a
      # whole-value replace, not a merge. Since Story 16.35 this job also builds `watch-android`,
      # so these args now govern BOTH builds: the Wear project's own `-Xmx2048m` has no effect
      # here and it runs at 4096m like the phone. That is deliberate headroom, not an accident —
      # but tuning `watch-android/gradle.properties` will not change what CI does.
      #
      # The two projects also pin DIFFERENT Gradle distributions (phone 9.0.0 from the
      # prebuild-generated wrapper, Wear 9.6.1 from its tracked one), so this job provisions two
      # of them. Sequential, never concurrent — `build_wear_apk!` runs after the phone build.
      - name: Tune Gradle memory for CI
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          org.gradle.daemon=false
          EOF
      # One lane, two artifacts: both are built and signing-parity-checked, then the
      # phone AAB goes to the mobile track and the Wear AAB to its `wear:` track.
      - name: Build and upload Android Alpha + Wear OS (RC)
        run: bundle exec fastlane android beta

      # `if: always()` is the point of this step, not an afterthought: the Wear bundle is
      # most worth having when the lane FAILED at the upload, which is exactly when the
      # default (success-only) behaviour would throw it away.
      #
      # It exists because Play may require the first artifact for a new form factor to be
      # uploaded by hand through the Console before the API can target that track — the
      # same bootstrap the phone app needed once. A hand upload needs a SIGNED bundle, and
      # the only signed one is built here: the release keystore is not in the repo, so a
      # local `bundleRelease` can only ever produce an unsigned artifact.
      - name: Upload Wear OS bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-os-bundle-${{ github.run_id }}
          path: watch-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
